<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CmdBox Flash · 轻量版代码地图</title>
<style>
:root{
  --bg:#070b14; --line:rgba(148,163,184,.30);
  --db:#34d399; --fe:#60a5fa; --be:#c084fc; --mn:#fbbf24;
  --txt:#e9eefb; --muted:#a3b4cc;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono","Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);overflow:hidden;
  font:15px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(52% 42% at 8% -4%,rgba(168,85,247,.24),transparent 62%),
             radial-gradient(44% 38% at 92% 2%,rgba(56,189,248,.16),transparent 62%),
             radial-gradient(58% 50% at 50% 112%,rgba(16,185,129,.12),transparent 62%);}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:15px 26px 0}
.brand{display:flex;align-items:center;gap:10px}
.brand .dot{width:10px;height:10px;border-radius:50%;
  background:linear-gradient(135deg,#f472b6,#a855f7);box-shadow:0 0 16px rgba(168,85,247,.95)}
h1{margin:0;font-size:17.5px;letter-spacing:.3px;font-weight:700}
h1 em{font-style:normal;font-family:var(--mono);color:#cbb6ff}
.stat{font-size:11.5px;color:#8ea2be;font-family:var(--mono)}
.stat b{color:#dbe7f7;font-weight:600}
.legend{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.055);color:var(--muted);white-space:nowrap;line-height:1.55}
.chip.db{color:#7bf0bb;border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.12)}
.chip.fe{color:#a5d0ff;border-color:rgba(96,165,250,.5);background:rgba(96,165,250,.12)}
.chip.be{color:#d8bdff;border-color:rgba(192,132,252,.5);background:rgba(192,132,252,.12)}
.chip.mn{color:#ffd98a;border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.12)}

.btn{cursor:pointer;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);
  color:#c7d5e8;font-size:12px;padding:5px 13px;border-radius:999px;font-family:inherit;
  transition:.18s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.14);color:#fff}
.btn.ghost{opacity:.35;pointer-events:none}
.btn .k{font-size:10px;opacity:.55;margin-left:5px;font-family:var(--mono)}
#back{margin-left:auto;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#back .k{opacity:.5}

.tabs{display:flex;gap:8px;padding:11px 26px 8px;flex-wrap:wrap}
.tab{cursor:pointer;font-size:13.5px;padding:8px 18px;border-radius:999px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#aebed6;
  transition:.22s;font-family:inherit}
.tab:hover{background:rgba(255,255,255,.11);color:#fff;transform:translateY(-1px)}
.tab.on{color:#fff;border-color:rgba(196,181,253,.8);
  background:linear-gradient(135deg,rgba(168,85,247,.48),rgba(56,189,248,.34));
  box-shadow:0 10px 26px -14px rgba(168,85,247,.95)}
.tab small{opacity:.62;font-size:11px;margin-left:7px}

.crumbs{display:flex;align-items:center;gap:6px;padding:0 26px 11px;flex-wrap:wrap;
  font-size:12px;color:#8ea2be;min-height:24px}
.crumbs button{cursor:pointer;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);
  color:#b9cbe4;font-size:11.5px;padding:2px 10px;border-radius:999px;font-family:inherit;
  transition:.16s}
.crumbs button:hover{background:rgba(255,255,255,.13);color:#fff}
.crumbs .sep{color:#4c6180;font-size:11px}
.trail{display:flex;align-items:center;gap:6px;padding:0 26px 10px;flex-wrap:nowrap;
  overflow-x:auto;font-size:11px;color:#6f83a0;scrollbar-width:none}
.trail:empty{display:none}
.trail .tlab{white-space:nowrap;font-size:10.5px;letter-spacing:.06em;color:#647a97}
.tchip{cursor:pointer;font-family:inherit;font-size:11px;padding:2px 9px;border-radius:999px;
  border:1px dashed rgba(148,163,184,.4);background:rgba(255,255,255,.03);color:#9fb2cc;
  max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:.16s}
.tchip:hover{background:rgba(125,211,252,.16);border-color:rgba(125,211,252,.65);color:#e8f4ff}
.tarrow{color:#3f5470;font-size:11px}
.tchip.tnow{border-style:solid;border-color:rgba(125,211,252,.75);background:rgba(125,211,252,.16);
  color:#eaf6ff;cursor:default}
.crumbs .cur{color:#eef4ff;font-weight:650;padding:2px 10px;border-radius:999px;
  border:1px solid rgba(125,211,252,.45);background:rgba(56,189,248,.12)}

.layout{flex:1;min-height:0;display:flex;align-items:flex-start;gap:16px;padding:0 18px 18px}
.map{position:relative;flex:0 0 auto;align-self:stretch;
  display:flex;align-items:center;justify-content:center;min-width:250px;overflow:auto;border-radius:20px;
  scrollbar-width:thin;scrollbar-color:rgba(56,189,248,.45) transparent;
  border:1px solid rgba(255,255,255,.1);
  background:
    radial-gradient(rgba(255,255,255,.055) 1px, transparent 1px) 0 0/22px 22px,
    linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 26px 60px -46px #000;
  padding:22px 24px}
.fit{transform-origin:top left;will-change:transform;transition:transform .22s ease;margin:auto 0}
.tree{}

.row{display:flex;align-items:center;position:relative}
.kids{display:flex;flex-direction:column;justify-content:center;gap:13px;padding-left:26px;position:relative}
.kids.hidden{display:none}
.kids > .row::before{content:'';position:absolute;left:-26px;top:-6px;bottom:-6px;width:1px;
  background:linear-gradient(180deg,transparent,var(--line) 8%,var(--line) 92%,transparent)}
.kids > .row:first-child::before{top:50%}
.kids > .row:last-child::before{bottom:50%}
.kids > .row::after{content:'';position:absolute;left:-26px;top:50%;width:26px;height:1px;
  background:var(--line)}
.anim{animation:pop .32s cubic-bezier(.2,.75,.3,1) both}
@keyframes pop{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}

.node{position:relative;cursor:pointer;user-select:none;
  transition:transform .3s cubic-bezier(.2,.75,.3,1),opacity .3s,filter .3s,
             border-color .3s,box-shadow .3s,background .3s}
.node.dim{opacity:.32;filter:grayscale(.35) brightness(.9);transform:scale(.93)}
.node.path{opacity:.78}
.node:hover{filter:brightness(1.12)}

.root{display:flex;flex-direction:column;gap:3px;padding:15px 38px 15px 21px;border-radius:18px;
  color:#fff;background:linear-gradient(140deg,#f472b6,#a855f7 72%);
  box-shadow:0 18px 40px -16px rgba(168,85,247,.95),inset 0 0 0 1px rgba(255,255,255,.34)}
.root.mod.db{background:linear-gradient(140deg,#34d399,#0ea5e9 70%)}
.root.mod.fe{background:linear-gradient(140deg,#38bdf8,#6366f1 72%)}
.root.mod.be{background:linear-gradient(140deg,#c084fc,#7c3aed 72%)}
.root .rt{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:.4px}
.root .rs{font-size:11.5px;opacity:.92}
.root .chev{position:absolute;right:11px;top:50%;transform:translateY(-50%);
  width:19px;height:19px;display:grid;place-items:center;border-radius:50%;
  background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.45);font-size:10px;color:#fff;
  transition:transform .3s}
.root.expanded{transform:scale(.975);opacity:.96}
.root.expanded .chev{transform:translateY(-50%) rotate(90deg)}
.root.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{
  0%,100%{box-shadow:0 18px 40px -16px rgba(168,85,247,.95),inset 0 0 0 1px rgba(255,255,255,.34),
          0 0 0 0 rgba(203,182,255,.55)}
  50%{box-shadow:0 18px 40px -16px rgba(168,85,247,.95),inset 0 0 0 1px rgba(255,255,255,.34),
          0 0 0 14px rgba(203,182,255,0)}
}

.phase{display:flex;align-items:center;gap:11px;padding:11px 15px 11px 12px;border-radius:16px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  box-shadow:0 10px 26px -20px #000;min-width:166px}
.phase .pnum{font-size:16px;color:#b3bfff;line-height:1}
.phase .ptxt,.file .ptxt{display:flex;flex-direction:column;line-height:1.34}
.phase .ptxt b,.file .ptxt b{font-size:15px;font-weight:650;letter-spacing:.35px}
.phase .ptxt i,.file .ptxt i{font-style:normal;font-size:11.5px;color:#9aacc6}
.phase .chev,.file .chev{margin-left:auto;font-size:11px;color:#7288a5;transition:transform .3s}
.phase.open{border-color:rgba(178,150,255,.85);
  box-shadow:0 0 0 2px rgba(168,140,255,.3),0 12px 30px -18px rgba(168,140,255,.95);
  transform:scale(.94) translateX(-4px);background:rgba(168,140,255,.14)}
.phase.open .chev,.file.open .chev{transform:rotate(90deg);color:#cbb6ff}

.file{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 12px;border-radius:15px;
  background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.15);
  box-shadow:0 10px 26px -22px #000;min-width:176px}
.file .ficon{font-size:12px;color:#6b83a0}
.file.open{border-color:rgba(125,211,252,.75);
  box-shadow:0 0 0 2px rgba(125,211,252,.28),0 12px 30px -18px rgba(56,189,248,.9);
  transform:scale(.95) translateX(-3px);background:rgba(56,189,248,.1)}

.step{width:300px;padding:11px 14px 12px 15px;border-radius:15px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  border-left:3px solid rgba(255,255,255,.2);
  box-shadow:0 10px 26px -22px #000}
.step.db{border-left-color:var(--db)}
.step.fe{border-left-color:var(--fe)}
.step.be{border-left-color:var(--be)}
.step.mn{border-left-color:var(--mn)}
.step .srow{display:flex;align-items:center;gap:9px}
.step .snum{width:21px;height:21px;flex:0 0 auto;display:grid;place-items:center;border-radius:7px;
  font-size:11.5px;font-weight:700;font-family:var(--mono);line-height:1}
.step .snum.db{background:rgba(52,211,153,.2);color:#7bf0bb;border:1px solid rgba(52,211,153,.5)}
.step .snum.fe{background:rgba(96,165,250,.2);color:#a5d0ff;border:1px solid rgba(96,165,250,.5)}
.step .snum.be{background:rgba(192,132,252,.2);color:#d8bdff;border:1px solid rgba(192,132,252,.5)}
.step .snum.mn{background:rgba(251,191,36,.18);color:#ffd98a;border:1px solid rgba(251,191,36,.5)}
.step .stitle{font-size:14.5px;font-weight:650;color:#f0f5ff}
.step .srow .chip{margin-left:auto;font-size:10px;padding:1px 7px}
.step .kchev{margin-left:2px;font-size:11px;color:#a9bcd4;transition:transform .28s}
.step.opened .kchev{transform:rotate(90deg);color:#7dd3fc}
.step .sfn{display:block;margin-top:7px;font-family:var(--mono);font-size:12px;color:#8fd8ff;
  word-break:break-word;line-height:1.45}
.step .sdesc{margin:6px 0 0;font-size:12.3px;line-height:1.62;color:#b9c9dd}
.step.sel{transform:scale(1.035);border-color:rgba(125,211,252,.95);
  background:linear-gradient(180deg,rgba(56,189,248,.18),rgba(56,189,248,.07));
  box-shadow:0 0 0 2px rgba(125,211,252,.55),0 20px 38px -20px rgba(56,189,248,1)}
.step.sel .sdesc{color:#d3e2f5}

.fn{width:322px;padding:10px 14px 11px 15px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  border-left:3px solid rgba(255,255,255,.2);
  box-shadow:0 10px 26px -22px #000}
.fn.db{border-left-color:var(--db)}
.fn.fe{border-left-color:var(--fe)}
.fn.be{border-left-color:var(--be)}
.fn .frow{display:flex;align-items:baseline;gap:9px}
.fn .fname{font-family:var(--mono);font-size:13.5px;font-weight:700;color:#9adcff}
.fn .fline{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:#7e93b0;white-space:nowrap}
.fn .fdesc{margin:5px 0 0;font-size:12.3px;line-height:1.58;color:#b9c9dd}
.fn .fcalls{margin:6px 0 0;font-family:var(--mono);font-size:11px;color:#8496b0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn .fcalls b{color:#b6c9e2;font-weight:600}
.fn.sel{transform:scale(1.035);border-color:rgba(125,211,252,.95);
  background:linear-gradient(180deg,rgba(56,189,248,.18),rgba(56,189,248,.07));
  box-shadow:0 0 0 2px rgba(125,211,252,.55),0 20px 38px -20px rgba(56,189,248,1)}
.fn.sel .fname{color:#c9ecff}
.fn.sel .fdesc{color:#d3e2f5}

/* 按键分支：等一个键 → Enter → 指令串 */
.knode{width:264px;padding:10px 13px 11px;border-radius:14px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);
  border-left:3px solid rgba(255,255,255,.2);box-shadow:0 10px 26px -24px #000}
.knode.db{border-left-color:var(--db)}
.knode.fe{border-left-color:var(--fe)}
.knode.be{border-left-color:var(--be)}
.knode.mn{border-left-color:var(--mn)}
.knode .khead{display:flex;align-items:center;gap:8px}
.knode .khead b{font-size:13.5px;font-weight:650;color:#eaf2ff;letter-spacing:.3px}
.knode .kchev{margin-left:auto;font-size:11px;color:#9fb2cc;transition:transform .28s}
.knode.opened .kchev{transform:rotate(90deg)}
.knode .kfn{display:block;margin-top:5px;font-family:var(--mono);font-size:11.5px;color:#8fd8ff}
.knode .kdesc{margin:5px 0 0;font-size:12px;line-height:1.58;color:#b9c9dd}
.knode.sel{transform:scale(1.03);border-color:rgba(125,211,252,.95);
  background:linear-gradient(180deg,rgba(56,189,248,.18),rgba(56,189,248,.06));
  box-shadow:0 0 0 2px rgba(125,211,252,.5),0 18px 34px -22px rgba(56,189,248,1)}
.kchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.kchip{font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(192,132,252,.55);background:rgba(192,132,252,.14);color:#dcc9ff;
  transition:.16s}
.kchip:hover{background:rgba(192,132,252,.3);color:#fff;transform:translateY(-1px)}

/* 代码栏 */
.code{flex:1 1 auto;align-self:stretch;min-width:300px;display:flex;flex-direction:column;min-height:0;
  border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.11);background:#080e1a;
  box-shadow:0 26px 60px -44px #000,inset 0 1px 0 rgba(255,255,255,.06)}
.code-head{display:flex;align-items:center;gap:10px;padding:11px 14px;flex:0 0 auto;
  border-bottom:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.03);
  font-family:var(--mono);font-size:11.5px;color:#a3b4cc}
.code-head .fname{color:#f0f5ff;font-size:13px;font-weight:600}
.code-head .fpath{color:#677d99;font-size:10.5px}
.code-head .rng{margin-left:auto;color:#7dd3fc;font-size:11px;white-space:nowrap}
.code-head button{cursor:pointer;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);color:#cbd5e1;font-size:11px;padding:3px 11px;
  border-radius:999px;font-family:inherit;transition:.2s;white-space:nowrap}
.code-head button:hover{background:rgba(255,255,255,.14);color:#fff}

.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 14px;
  border-bottom:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.022)}
.chain:empty{display:none}
.cw{font-family:var(--mono);font-size:10px;color:#7b8ea8;letter-spacing:.06em}
.cchip{font-family:var(--mono);font-size:11.5px;padding:2px 9px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#c3d4ea;
  transition:.16s}
.cchip:hover{background:rgba(255,255,255,.14);color:#fff;transform:translateY(-1px)}
.cchip.db{border-color:rgba(52,211,153,.5);color:#7bf0bb}
.cchip.fe{border-color:rgba(96,165,250,.5);color:#a5d0ff}
.cchip.be{border-color:rgba(192,132,252,.5);color:#d8bdff}
.cchip.on{background:rgba(56,189,248,.26);border-color:#7dd3fc;color:#fff;
  box-shadow:0 0 0 1px rgba(125,211,252,.5)}
.csep{color:#54687f;font-size:11px}

.code-body{position:relative;flex:1;min-height:0;overflow:auto;padding:8px 0 44px;
  font-family:var(--mono);font-size:13.2px;line-height:1.75;scrollbar-width:thin}
.ln{display:grid;grid-template-columns:52px 1fr;min-height:1.75em;
  transition:background .3s,color .3s,opacity .3s;color:#cfdcee}
.ln .num{text-align:right;padding-right:14px;font-size:10.8px;color:#4b5d79;user-select:none}
.ln .txt{white-space:pre;padding-right:18px}
.ln.cold{opacity:.3}
.ln.hot{background:linear-gradient(90deg,rgba(56,189,248,.2),rgba(56,189,248,.02) 74%);
  box-shadow:inset 3px 0 0 #38bdf8;color:#f4f9ff}
.ln.hot .num{color:#7dd3fc}
.sec{display:flex;align-items:center;padding:10px 0 4px 15px}
.sec span{font-size:10px;letter-spacing:.14em;color:#7b8ea8;
  border-left:2px solid rgba(168,140,255,.85);padding-left:8px}
.cm{color:#69809c;font-style:italic}
.st{color:#8ce9b0}
.kw{color:#cba6ff}
.pp{color:#f2b0ff}
.nu{color:#ffcb6b}
.fi{color:#83d6ff}

.hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:11.5px;
  color:#6d819c;pointer-events:none;transition:opacity .3s}

@media (max-width:1080px){
  body{overflow:auto}
  .wrap{height:auto;min-height:100%}
  .layout{flex-direction:column}
  .map{align-self:stretch;max-width:none;width:100%;max-height:64vh}
  .code{min-height:56vh}
  #back{margin-left:0}
}

/* ---------- 使用教程：模拟终端 ---------- */
.chip.tt{color:#8ff0dd;border-color:rgba(45,212,191,.5);background:rgba(45,212,191,.12)}
.step .snum.tt{background:rgba(45,212,191,.18);color:#8ff0dd;border:1px solid rgba(45,212,191,.5)}
.warn{font-size:11px;padding:1px 6px;border-radius:6px;background:rgba(251,146,60,.16);
      border:1px solid rgba(251,146,60,.45);color:#ffbe7a;white-space:nowrap}
.term-empty{color:#5f7897;font-size:12.5px;padding:18px 4px}
.term{background:#080e18;border:1px solid #1e2c44;border-radius:12px;padding:14px 16px 16px;
      font-family:ui-monospace,'JetBrains Mono',Consolas,monospace;font-size:12.4px;line-height:1.85;
      color:#c9dcf2;overflow:auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.term .tbar{display:flex;align-items:center;gap:6px;margin-bottom:12px;
            padding-bottom:9px;border-bottom:1px solid #16233a}
.term .tdot{width:9px;height:9px;border-radius:50%;background:#243349;display:inline-block}
.term .tdot.r{background:#3d2b31}.term .tdot.y{background:#3a3527}.term .tdot.g{background:#22382f}
.term .ttitle{margin-left:6px;font-size:11.5px;color:#5f7ba0;letter-spacing:.4px}
.term .tkeys{margin-left:auto;display:flex;gap:5px}
.term kbd{font-family:inherit;font-size:11px;padding:1px 7px;border-radius:6px;color:#0b1220;
          background:linear-gradient(180deg,#9fe3d4,#5ec9b4);border:1px solid #7fd8c5;font-weight:700}
.term .tline{white-space:pre-wrap;word-break:break-word}
.term .tdim{color:#6b83a4}
.term .tgap{height:9px}
.term .tprompt{color:#63d6b6}
.term .tuser{color:#63d6b6;font-weight:600}
.term .tpath{color:#5578a0}
.term .tin{color:#eaf4ff}
.term .tcur{display:inline-block;width:7px;height:14px;margin-left:2px;vertical-align:-2px;
            background:#9fe3d4;animation:tblink 1.1s steps(1) infinite}
@keyframes tblink{0%,49%{opacity:1}50%,100%{opacity:0}}
.term .trow{display:flex;align-items:baseline;white-space:pre;border-radius:6px;padding:1px 4px;margin:1px 0}
.term .trow.on{background:rgba(99,214,182,.10);box-shadow:inset 2px 0 0 #63d6b6}
.term .trow .tsel{color:#63d6b6;font-weight:700}
.term .tcmd{color:#e8f2ff}
.term .trow.on .tcmd{color:#ffffff;font-weight:600}
.term .tnote{color:#6f86a4;margin-left:10px;min-width:0;flex:0 1 auto;overflow:hidden;
           text-overflow:ellipsis;white-space:nowrap}
.term .ttag{color:#5f7897;margin-left:10px}
.term .tid{color:#3f5673;margin-left:auto;padding-left:12px}
.term .tmsg{color:#ffd98a;padding:2px 0}
.term .task{color:#8ff0dd}
.term .tdone{color:#6f86a4}
.term .tsay{color:#7f97b6;margin-top:10px;padding-top:9px;border-top:1px dashed #1a2740}
.term .hit{color:#ff8f8f;font-weight:700}
.term .tline.tcmd{color:#e8f2ff}
.term .tline.tnote{color:#6f86a4}


/* ---------- 轻量版总览 ---------- */
.lite{font-size:10.5px;padding:2px 9px;border-radius:999px;color:#8ff0dd;
  border:1px solid rgba(94,234,212,.4);background:rgba(94,234,212,.08);letter-spacing:.3px}
.map.intro-on{flex:1 1 100%;width:100%;max-width:none;align-items:stretch;justify-content:flex-start;
  padding:0;overflow:auto}
.map.intro-on .fit,.map.intro-on .hint,.map.intro-on .play{display:none}
.layout.intro-on .code{display:none}
.intro{display:none;width:100%;box-sizing:border-box;padding:26px 30px 34px}
.map.intro-on .intro{display:block}
.intro-mode #crumbs,.intro-mode #trail{display:none}
.ihero{padding:2px 0 18px;border-bottom:1px solid rgba(255,255,255,.09)}
.ikicker{font-family:var(--mono);font-size:11px;color:#7dd3fc;letter-spacing:.8px}
.ihero h2{margin:8px 0 10px;font-size:32px;letter-spacing:-.5px;color:#f2f7ff}
.ihero h2 em{font-style:normal;background:linear-gradient(100deg,#5eead4,#7dd3fc 60%,#c4b5fd);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ilede{max-width:74ch;margin:0;font-size:13.5px;line-height:1.8;color:#b9c9dd}
.istats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.istats div{min-width:104px;padding:9px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.11);
  background:rgba(255,255,255,.04)}
.istats b{display:block;font-family:var(--mono);font-size:20px;color:#9ff0e2;line-height:1.2}
.istats span{font-size:11px;color:#7f93ad}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
@media (max-width:820px){.igrid{grid-template-columns:1fr}}
.icard{padding:16px 18px;border-radius:15px;border:1px solid rgba(255,255,255,.1);
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015))}
.icard h3{margin:0 0 11px;font-size:14px;color:#e8f2ff;letter-spacing:.2px}
.iminus{color:#fb7185;font-weight:800;margin-right:4px}
.iplus{color:#5eead4;font-weight:800;margin-right:4px}
.idiff{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.idiff li{font-size:12.3px;line-height:1.62;color:#a9bcd4}
.idiff li b{display:block;color:#dbe9fb;font-size:12.8px;margin-bottom:1px}
.idiff.plus li b{color:#bdf5ea}
.icard code{font-family:var(--mono);font-size:11.5px;padding:1px 5px;border-radius:5px;
  background:rgba(125,211,252,.1);color:#a5d0ff}
.iplugin{margin-top:14px}
.itwo{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
@media (max-width:820px){.itwo{grid-template-columns:1fr}}
.ilabel{margin:9px 0 4px;font-family:var(--mono);font-size:10.5px;color:#6f86a4;letter-spacing:.4px}
.icard pre{margin:0;padding:10px 12px;border-radius:9px;background:#080e1a;border:1px solid #1a2740;
  font-family:var(--mono);font-size:11.3px;line-height:1.65;color:#9fb3cd;overflow:auto}
.icard pre b{color:#8ff0dd;font-weight:600}
.iplugin p{margin:12px 0 0;font-size:12.2px;line-height:1.7;color:#93a8c2}
.igobtn{cursor:pointer;margin-top:13px;padding:7px 16px;border-radius:9px;font:inherit;font-size:12.5px;
  color:#06251f;background:linear-gradient(135deg,#5eead4,#7dd3fc);border:0;font-weight:650}
/* ---------- 功能试用：键盘面板 ---------- */
.map.play-on{flex:0 0 auto;width:404px;min-width:340px;max-width:48%}
.map.play-on .fit{display:none}
.map.play-on .hint{display:none}
.play{display:none;flex-direction:column;gap:10px;min-height:0;overflow:auto;padding:2px 2px 4px}
.map.play-on .play{display:flex}
.phead{display:flex;align-items:baseline;gap:9px}
.phead b{font-size:13.5px;color:#dbe9fb;letter-spacing:.3px}
.phead span{font-size:11.5px;color:#5f7897}
.tbox{width:100%;box-sizing:border-box;font:inherit;font-size:12.5px;padding:7px 10px;
      border-radius:9px;border:1px solid #22334d;background:#0b1524;color:#eaf4ff;outline:none}
.tbox:focus{border-color:#3f7f6e;box-shadow:0 0 0 3px rgba(99,214,182,.12)}
.pquick{display:flex;flex-wrap:wrap;gap:6px}
.pquick button{font:inherit;font-size:11.5px;padding:3px 10px;border-radius:8px;
      border:1px solid #22334d;background:#101a2a;color:#9db8d8;cursor:pointer}
.pquick button:hover{border-color:#3f7f6e;color:#c9f3e7}
.pkb{display:flex;flex-direction:column;gap:5px}
.pkb .krow{display:flex;gap:5px}
.pkb .krow .k{flex:1 1 0;min-width:0;padding:0}
.k{min-width:27px;height:28px;padding:0 3px;display:grid;place-items:center;font:inherit;font-size:12px;
   font-size:12px;border-radius:7px;border:1px solid #22334d;background:#0e1725;color:#c2d6ef;
   cursor:pointer;user-select:none}
.k:hover{background:#16243a;border-color:#3a5b86}
.k:active{transform:translateY(1px);background:#1c2c46}
.pspec{display:flex;flex-wrap:wrap;gap:6px}
.pspec .k{width:auto;padding:0 11px;font-size:11.5px;background:#132131;border-color:#2b4260;color:#9fc4ea}
.pspec .k.warnk:hover{border-color:#a4643c;color:#ffbe7a}
.pfoot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:8px;border-top:1px solid #16233a}
#pstate{flex:1;font-size:11.5px;color:#7f97b6;line-height:1.5}
#pReset{font:inherit;font-size:11.5px;padding:4px 12px;border-radius:8px;border:1px solid #22334d;
        background:#101a2a;color:#9db8d8;cursor:pointer}
#pReset:hover{border-color:#3a5b86;color:#d6e8ff}
/* ================== 美化层（只调外观，不动结构） ================== */
:root{
  --bg:#070a12;
  --panel:#0b1220;
  --panel-2:#0e1626;
  --line:rgba(148,163,184,.17);
  --line-2:rgba(148,163,184,.30);
  --txt:#e8eef9;
  --muted:#9aaec8;
  --accent:#5eead4;
  --accent-2:#7dd3fc;
  --hot:#38bdf8;
  --radius-l:16px;
  --radius-m:13px;
  --shadow-panel:0 30px 70px -50px #000,inset 0 1px 0 rgba(255,255,255,.06);
  --ease:cubic-bezier(.2,.72,.3,1);
}
html{color-scheme:dark}
body{background:var(--bg);color:var(--txt);letter-spacing:.1px}
body::before{
  background:
    radial-gradient(46% 38% at 6% -6%,rgba(94,234,212,.13),transparent 64%),
    radial-gradient(44% 36% at 96% 0%,rgba(99,102,241,.16),transparent 62%),
    radial-gradient(60% 50% at 50% 116%,rgba(56,189,248,.09),transparent 66%);
}
::selection{background:rgba(94,234,212,.26);color:#f2fffd}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(148,163,184,.22);border-radius:99px;
  border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.42);background-clip:content-box}
:focus-visible{outline:2px solid rgba(94,234,212,.55);outline-offset:2px}

/* 顶栏 */
header{padding:16px 26px 0;align-items:center}
h1{font-size:18px;letter-spacing:.2px;font-weight:700;
   background:linear-gradient(92deg,#f6fbff,#c3d6ee);-webkit-background-clip:text;
   background-clip:text;-webkit-text-fill-color:transparent}
h1 em{color:#9fe9dc;-webkit-text-fill-color:#9fe9dc;font-weight:600}
.brand .dot{width:9px;height:9px;background:linear-gradient(135deg,#5eead4,#38bdf8);
  box-shadow:0 0 14px rgba(94,234,212,.8)}
.stat{font-size:11px;color:#8195b1;letter-spacing:.2px}
.stat b{color:#d6e4f7}
.chip{font-size:10.5px;padding:2px 9px;letter-spacing:.2px;line-height:1.6}
.btn{border-radius:10px;font-size:11.5px;padding:5px 12px;transition:.16s var(--ease)}
.btn:hover{transform:translateY(-1px)}
#back{border-radius:10px}

/* 标签页：分段的胶囊 */
.tabs{align-self:flex-start;gap:4px;padding:5px;margin:12px 26px 10px;
  border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.028);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.tab{border:0;background:transparent;border-radius:10px;padding:9px 19px;font-size:15px;
  color:#9db0c9;transition:.18s var(--ease)}
.tab:hover{background:rgba(255,255,255,.06);color:#e6f0ff;transform:none}
.tab.on{color:#eafffb;
  background:linear-gradient(180deg,rgba(94,234,212,.2),rgba(94,234,212,.07));
  box-shadow:inset 0 0 0 1px rgba(94,234,212,.42),0 6px 16px -12px rgba(94,234,212,.9)}
.tab small{opacity:.5;font-size:11.5px;margin-left:6px}

/* 面包屑 / 走过 */
.crumbs,.trail{padding-left:26px;padding-right:26px}
.crumbs .cur{background:rgba(94,234,212,.1);border-color:rgba(94,234,212,.4);color:#f0fbf9}
.crumbs button,.tchip{border-radius:9px}
.tchip{background:rgba(255,255,255,.025)}
.tchip.tnow{background:rgba(94,234,212,.14);border-color:rgba(94,234,212,.6);color:#effcfa}

/* 两块大面板 */
.layout{gap:14px;padding:0 16px 16px}
.map{border-radius:var(--radius-l);border:1px solid var(--line);background:
   radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px) 0 0/24px 24px,
   linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  box-shadow:var(--shadow-panel)}
.code{border-radius:var(--radius-l);border:1px solid var(--line);
  background:linear-gradient(180deg,#080e19,#070b13);box-shadow:var(--shadow-panel)}
.code-head{padding:10px 15px;border-bottom-color:var(--line);background:rgba(255,255,255,.022)}
.code-head .fname{font-size:12.5px;letter-spacing:.2px}
.code-head .rng{font-size:10.5px}
.code-head button{border-radius:9px;font-size:10.5px;padding:3px 10px}
.chain{padding:7px 15px;background:rgba(255,255,255,.015);border-bottom-color:var(--line)}
.cchip{font-size:11px;border-radius:8px}

/* 节点：统一质感 */
.root{border-radius:15px;background:linear-gradient(140deg,rgba(139,92,246,.95),rgba(67,110,240,.92));
  box-shadow:0 22px 46px -26px rgba(99,102,241,.95),inset 0 0 0 1px rgba(255,255,255,.26)}
.root .rt{font-size:18px}
.root.mod.db{background:linear-gradient(140deg,rgba(16,185,129,.95),rgba(14,132,180,.92))}
.root.mod.fe{background:linear-gradient(140deg,rgba(56,189,248,.95),rgba(79,102,241,.92))}
.root.mod.be{background:linear-gradient(140deg,rgba(167,139,250,.95),rgba(109,40,217,.92))}
.phase,.file,.step,.fn,.knode{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.026));
  border:1px solid var(--line-2);box-shadow:0 12px 30px -26px #000}
.phase{border-radius:14px;padding:10px 15px 10px 12px}
.file{border-radius:13px}
.step,.fn,.knode{border-radius:13px;transition:transform .24s var(--ease),border-color .24s,
  background .24s,box-shadow .24s}
.step:hover,.fn:hover,.knode:hover,.phase:hover,.file:hover{border-color:rgba(148,163,184,.5);
  transform:translateY(-1px)}
.step.sel,.fn.sel,.knode.sel{border-color:rgba(94,234,212,.85);
  background:linear-gradient(180deg,rgba(94,234,212,.14),rgba(94,234,212,.04));
  box-shadow:0 0 0 1px rgba(94,234,212,.4),0 22px 40px -26px rgba(94,234,212,.95)}
.phase.open{border-color:rgba(125,211,252,.7);background:rgba(125,211,252,.1);
  box-shadow:0 0 0 1px rgba(125,211,252,.3),0 16px 34px -24px rgba(56,189,248,.9)}
.file.open{border-color:rgba(125,211,252,.6);background:rgba(56,189,248,.08)}
.node.dim{opacity:.3;filter:grayscale(.5) brightness(.86);transform:scale(.94)}
.step .stitle{font-size:14px}
.step .sdesc,.fn .fdesc,.knode .kdesc{color:#b3c4d9}

/* 代码行 */
.code-body{font-size:13px;line-height:1.78;padding:10px 0 44px}
.ln .num{font-size:10.5px;color:#55698a;padding-right:16px}
.ln{grid-template-columns:54px 1fr;border-radius:0}
.ln.hot{background:linear-gradient(90deg,rgba(94,234,212,.15),rgba(94,234,212,.015) 78%);
  box-shadow:inset 2px 0 0 var(--accent);color:#f4fbff}
.ln.hot .num{color:#7fe7d6}
.ln.cold{opacity:.26}
.sec span{font-size:9.5px;letter-spacing:.16em;color:#7d90ab}
.kw{color:#c4a9ff}.st{color:#8ce9b0}.cm{color:#67809e}

/* 终端 */
.term{background:linear-gradient(180deg,#08111c,#060a12);border:1px solid #1c2b43;
  border-radius:13px;font-size:12.6px;line-height:1.9;color:#cfe0f5;
  box-shadow:0 24px 50px -40px #000,inset 0 1px 0 rgba(255,255,255,.05);padding:13px 16px 15px}
.term .tbar{border-bottom-color:#16233a;margin-bottom:11px}
.term .tdot{width:8px;height:8px}
.term .ttitle{font-size:11px;color:#5d7ba3}
.term .trow{padding:1px 6px;border-radius:7px}
.term .trow.on{background:rgba(94,234,212,.12);box-shadow:inset 2px 0 0 var(--accent)}
.term .tprompt,.term .tuser{color:#6ee7cf}
.term .tnote{color:#7187a6}
.term .ttag{color:#6a86a8}
.term .tid{color:#4e6a8c}
.term .tcur{background:#7fe7d6}
.term kbd{background:linear-gradient(180deg,#a8ecdd,#5ec9b4);border-color:#7fd8c5;color:#06231d}
.term .hit{color:#ff9aa2}
.term-empty{color:#6b83a4}

/* 键盘 */
.play{gap:11px}
.phead b{font-size:13px;color:#e2eefc}
.tbox{background:#0a1322;border-color:#1f3049;border-radius:10px;font-size:12.5px;
  transition:.16s var(--ease)}
.tbox:hover{border-color:#2b4460}
.tbox:focus{border-color:rgba(94,234,212,.6);box-shadow:0 0 0 3px rgba(94,234,212,.12)}
.pquick button{background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:8px;color:#a8bfd9;font-size:11px;transition:.14s var(--ease)}
.pquick button:hover{background:rgba(94,234,212,.12);border-color:rgba(94,234,212,.5);
  color:#ddfff7;transform:translateY(-1px)}
.pkb{gap:6px}
.pkb .krow{gap:6px}
.k{border-radius:9px;background:linear-gradient(180deg,#17263c,#0f1a2a);
  border:1px solid #26374f;border-bottom:2px solid #1a2740;color:#cfe0f3;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  transition:background .14s var(--ease),border-color .14s,color .14s,transform .06s}
.k:hover{background:linear-gradient(180deg,#1e3252,#132036);border-color:#3c5b7d;color:#f2fbff}
.k:active{transform:translateY(1px);border-bottom-width:1px}
.pspec .k{background:rgba(255,255,255,.045);border:1px solid var(--line);
  border-bottom:2px solid rgba(148,163,184,.22);color:#b4c9e2;font-size:11px}
.pspec .k:hover{background:rgba(94,234,212,.12);border-color:rgba(94,234,212,.45);color:#e6fffb}
.pspec .k.warnk{color:#f2a8a8;border-color:rgba(239,110,110,.35)}
.pspec .k.warnk:hover{background:rgba(239,110,110,.14);border-color:rgba(239,110,110,.6);color:#ffd7d7}
.pfoot{border-top-color:var(--line);padding-top:9px}
#pstate{color:#8299b8}
#pReset{background:rgba(94,234,212,.1);border-color:rgba(94,234,212,.35);color:#c7fbf2;
  border-radius:9px;transition:.16s var(--ease)}
#pReset:hover{background:rgba(94,234,212,.2);border-color:rgba(94,234,212,.6);color:#fff;
  transform:translateY(-1px)}
.hint{color:#7189a9}

/* ---------- 视觉小功能 ---------- */
/* 1. 代码栏顶上那条"选中区间在文件里的位置" */
.rbar{position:relative;height:2px;flex:0 0 auto;overflow:hidden;
  background:rgba(148,163,184,.1)}
.rbar i{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:2px;
  background:linear-gradient(90deg,#5eead4,#7dd3fc);
  box-shadow:0 0 12px rgba(94,234,212,.6);
  transition:left .38s var(--ease),width .38s var(--ease)}

/* 2. 点中一张卡，外面荡一圈涟漪 */
.node.tap::after{content:'';position:absolute;inset:-3px;border-radius:inherit;
  border:1px solid rgba(94,234,212,.7);pointer-events:none;
  animation:tapring .54s ease-out both}
@keyframes tapring{0%{opacity:.9;transform:scale(.99)}100%{opacity:0;transform:scale(1.06)}}

/* 3. 按下去的键帽亮一下 */
.k.flash{background:linear-gradient(180deg,#2f7d6f,#1d4e46)!important;
  border-color:rgba(94,234,212,.9)!important;color:#eafffb!important;
  box-shadow:0 0 0 2px rgba(94,234,212,.28),0 0 22px rgba(94,234,212,.45)!important;
  transform:translateY(1px)}

/* 4. 高亮行从左轻轻滑进来 */
.ln.hot{animation:linein .3s var(--ease) both}
@keyframes linein{from{opacity:.35;transform:translateX(-5px)}to{opacity:1;transform:none}}

/* 5. 连接线有方向感 */
.kids > .row::after{background:linear-gradient(90deg,rgba(148,163,184,.55),rgba(148,163,184,.2))}

/* 6. 选中卡上的编号/行号徽章微微发光 */
.step.sel .snum{box-shadow:0 0 0 3px rgba(94,234,212,.14),0 0 14px rgba(94,234,212,.35)}
.fn.sel .fline{color:#9ff0e2}

/* 7. 载入时一块一块浮上来 */
header{animation:fadeUp .5s var(--ease) both}
.tabs{animation:fadeUp .5s var(--ease) .05s both}
.crumbs{animation:fadeUp .5s var(--ease) .09s both}
.layout{animation:fadeUp .55s var(--ease) .13s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span><h1>CmdBox Flash · <em>代码地图</em></h1><span class="lite">轻量版 · 插件向</span></div>
    <div class="stat" id="stat"></div>
    <div class="legend">
      <span class="chip db">数据库</span>
      <span class="chip fe">前端</span>
      <span class="chip be">后端</span>
    </div>
    <button class="btn ghost" id="back">← 返回<span class="k">Esc</span></button>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <div class="crumbs" id="crumbs"></div>

  <div class="layout" id="layout">
    <section class="map" id="map">
      <div class="fit" id="fit"><div class="tree" id="tree"></div></div>
      <div class="hint" id="hint">点节点展开</div>
      <div class="play" id="play">
        <div class="phead"><b>动手试</b><span>点按键＝敲键盘</span></div>
        <input class="tbox" id="typeBox" placeholder="也可以直接在这里打字…"
               autocomplete="off" spellcheck="false">
        <div class="pquick" id="pquick"></div>
        <div class="pkb" id="pkb"></div>
        <div class="pspec" id="pspec"></div>
        <div class="pfoot"><span id="pstate"></span><button id="pReset">重置</button></div>
      </div>
    </section>
    <aside class="code">
      <div class="code-head">
        <span class="fname" id="fileName">main.cpp</span>
        <span class="fpath" id="filePath"></span>
        <span class="rng" id="rangeLabel"></span>
        <button id="reset">看全部</button>
      </div>

<script>
const SOURCES = {"main.cpp": {"path": "main.cpp", "lines": ["#include \"list.h\"", "#include \"storage存放.h\"", "#include \"kmp_search.h\"", "#include \"linux.h\"", "#include \"Enter.h\"", "#include \"screen.h\"", "", "#include \"list.cpp\"", "#include \"storage存放.cpp\"", "#include \"kmp_search.cpp\"", "#include \"linux.cpp\"", "#include \"Enter.cpp\"", "#include \"screen.cpp\"", "", "int main(int argc,char*argv[])", "{", "bool pick=false;//pick是终端模式", "if(argc>1&&string(argv[1])==\"--pick\")pick=true;", "//ai生成-脚本所需内容", "", "    App app;//path,L,T;", "    app.path=dataPath();", "    initList(app.L);", "", "   loadItems(app.path,app.L);", "    //从本地文件下载命令，读instream in+in.open()+getline in", "    //下载=分割+id转类型+命令4部分合成为一命令+新建节点合并到链表里", "    //如果没有data.txt就新建txt，用源代码里的预制命令", "    saveItems(app.path,app.L);", "    //如果文件是空的，把空预制命令插到链表上后用这个saveItems把预制的命令搞到文件里", "", "    rawOn();//改Linux原本设置", "", "", "streambuf *oldBuf=cout.rdbuf();", "ofstream tty;", "string chosen=\"\";", "if(pick)", "{     ", "    tty.open(\"/dev/tty\");     ", "    cout.rdbuf(tty.rdbuf());", "}//ai生成-脚本所需内容", "", "", "    string input,msg,text;", "    //input=用户子串,msg提示词,text=按下的键", "    int sel=0,top=0;", "    //sel=选中命令的下标,命令最上面那一条的下标.", "", "    while(true)", "    {", "        vector<Node*> cand;", "        for(Node *p=app.L->dummyH->next;p!=app.L->dummyT;p=p->next)", "        {", "            string s=p->item.cmd+\"\\n\"+p->item.note+\"\\n\"+p->item.tag+\"\\n\"+to_string(p->item.id);", "            if(input==\"\"||kmpAll(s,input).empty()==0)", "            //若无子串(意思就是空的话全部都显示上去)or匹配上了", "            {", "                cand.push_back(p);", "            }", "        }", "", "        draw(&app,input,cand,sel,msg,top);", "        //cand是节点,有id tag note cmd，cmd用input对应。", "        //sel,top上去是为了滚动算法，看什么时候需要显示1-6变成显示2-7.", "        //显示函数", "        msg=\"\";", "", "        KeyType k=readKey(text);", "        //等待按按键.例如输入了git后等待按enter", "        if(k==Quit)break;", "        if(k==Char)", "        {", "            input+=text;", "            sel=0;", "        }", "        else if(k==Back)", "        {", "        if(input.empty()==0)", "        {   ", "            int i=input.size()-1;//", "            while(((unsigned char)input[i]&0xC0)==0x80)i--;", "            //位与&检查,因为要检查他的前两位是不是10，是10说明是2-4字节。", "            //s[i]与0xC0=1100 0000位于比较，由于末尾6位0xC0都是0，因此结果六位都是0", "            //剩下前缀2位，如果是10和11比，就是10 000000 =0x80", "            //就说明是尾字节，非头字节", "            //中文字符是2-4字节，若是3字节的中文字符，则是1110 xxxx,4字节则1111 xxxx", "            //2字节 1100 xxxx,如果是2-4字节的，他还会有除了头字节外的尾字节", "            //尾字节是10xx xxxx,所以这么位于比较。", "            //然后i--，直到找到头字节，", "            input.erase(i);", "            //erase的i指向头字节，就把头字节和尾字节删了。 ", "        }", "        sel=0;", "        }", "        //由于按了BackSpace后，需要重新检测input", "        //因此需要额外popChar，", "        //而非只是用户看不到那个字符了而已。", "        else if(k==Up)", "        {", "            if(sel>0)sel--;", "        }", "        else if(k==Down)", "        {", "            if(sel+1<(int)cand.size())sel++;", "        }", "        else if(k==Tab)", "        {", "            if(cand.empty()==0)input=cand[sel]->item.cmd;", "            //此刻出来了命令，按了上下键盘，指向命令了", "            //然后按tab补全你的命令;", "            sel=0;//补全后input变了，然后候选命令only自己了", "            if(pick)//脚本模式:补全完就把这一行交给bash", "            {", "                chosen=input;", "                break;", "            }", "        }", "        else if(k==Enter)", "        {     ", "            if(input.size()>0&&input[0]==':')", "            {", "                runCommand(&app,input.substr(1),msg);", "                //substr(1)：从第一行开始取input,当string", "                //然后runConmand看他:后，空格前是啥。空格后是啥。", "            }", "            input=\"\";", "            sel=0;", "            //按回车后要初始化，不按回车不用。", "        }", "    }", "", "    rawOff();", "", "    cout.rdbuf(oldBuf);//换回真stdout(ai)", "    if(pick){if(chosen!=\"\")cout<<chosen<<\"\\n\";}", "    //终端模式,返回选中命令.", "", "    else{cout<<\"\\n已退出,数据保存在 \"<<app.path<<\"\\n\";}", "    destroyList(app.L);", "    return 0;", "}"]}, "list.cpp": {"path": "database/src/list.cpp", "lines": ["#include \"list.h\"", "void initList(CommandList *&L)", "{", "    L=new CommandList();", "    L->dummyH=new Node();", "    L->dummyT=new Node();", "    L->dummyH->next=L->dummyT;", "    L->dummyT->prev=L->dummyH;", "    L->size=0;", "}", "void destroyList(CommandList *&L)", "{", "    Node *p=L->dummyH,*q;", "    while(p!=nullptr)", "    {", "        q=p->next;", "        delete p;", "        p=q;", "    }", "    delete L;L=nullptr;", "    //首先，给dummyHT分配了内存，放HT的节点的，", "    //然后再新建节点输入数据，插入进去，", "    //于是接下来链表成了H->1->2->3->T,", "    //五个节点都是有内存的，", "    //此刻qp做遍历把五个内存全都释放。", "}", "int nextFreeId(CommandList *L)//最小空号:1,2,3,...", "{", "    int id=1;", "    for(Node *q=L->dummyH->next;q!=L->dummyT;q=q->next)", "    {", "        if(q->item.id>id)break;//中间有空号", "        if(q->item.id==id)id++;//这个号被占了,看下一个", "    }", "    return id;", "}", "//发id的.", "void insertBefore(CommandList *L,Node *tail,Node *p)", "{", "    p->prev=tail->prev;", "    p->next=tail;", "    tail->prev->next=p;", "    tail->prev=p;", "    L->size++;", "    return ;", "}", "void addItem(CommandList *L,string cmd,string note,string tag,int fid)", "// :add git status,查看状态，git.没有提供id，因此自动丢给末尾。", "{", "    CommandItem x;", "    x.id=(fid==-1)?nextFreeId(L):fid;", "    //id有两个来源，第一个是文档里的id，第二个是派发的id", "    x.cmd=cmd;", "    x.tag=tag;", "    x.note=note;", "", "    Node *p=new Node();", "    p->item=x;", "", "    Node *pos=L->dummyT;//按id升序插入,否则新号会跑到链表末尾", "    for(Node *q=L->dummyH->next;q!=L->dummyT;q=q->next)", "    {", "        if(q->item.id>x.id){pos=q;break;}", "        //找链表里 最开始是哪个节点的id比p的大的", "    }", "    insertBefore(L,pos,p);", "    //找到了后就把id对应节点插入到 pos节点的前面。", "}", "void removeNode(CommandList *L,Node *p)", "{", "    p->prev->next=p->next;", "    p->next->prev=p->prev;", "    L->size--;", "    delete p;", "}", "Node *findById(CommandList *L,int id)", "{", "    Node *p=L->dummyH;", "    for(int i=0;i<L->size;i++)", "    {", "        p=p->next;", "        if(p->item.id==id)return p;", "    }", "    return nullptr;", "}", "//从L里找id，返回对应的节点，用于:del :edit"]}, "storage存放.cpp": {"path": "database/src/storage存放.cpp", "lines": ["#include \"storage存放.h\"", "#include<unistd.h>", "//--------------------------Tool-------------------------------", "void parseInt(const string &s,int &id)", "{", "    if(s.empty()) return ;", "    if(s.size()>9) return ;", "    //太长，防止溢出", "    int v=0;", "    for(char c:s)", "    {", "        if(c<'0'||c>'9') return ;  ", "        //混进非数字", "        v=v*10+(c-'0');", "    }", "    id=v;", "    return ;", "}", "//工具函数,用于loadItems:把string id变为int", "vector<string>splitLine(string line,char sep)", "//sep=separate：分割", "{", "    vector<string>parts;", "    string cur;", "    for(char c:line)", "    {", "        if(c==sep)", "        {parts.push_back(cur);cur.clear();}", "        else cur+=c;", "    }//在不遇到分隔符之前，一股脑丢到cur里", "    //遇到分隔符后，把装有东西的cur丢到part里，然后clear", "    parts.push_back(cur);", "    return parts;", "}", "//工具函数, 用于loadItems:分割一行的命令。", "void loadDefaults(CommandList *L)", "{", "    addItem(L,\"git add -A\",\"暂存所有改动\",\"git\",-1);", "    addItem(L,\"git commit -m \\\"fix\\\"\",\"提交并写明本次修复内容\",\"git\",-1);", "    addItem(L,\"git push\",\"把本地提交推送到远程仓库\",\"git\",-1);", "    addItem(L,\"g++ -o main main.cpp\",\"最简编译：把 main.cpp 编译成 main\",\"build\",-1);", "    addItem(L,\"make -j4\",\"并行编译整个项目\",\"build\",-1);", "    addItem(L,\"ls -la\",\"列出所有文件（含隐藏文件）\",\"linux\",-1);", "}", "//工具函数,用于loadItems:如果下载失败，制作模板txt", "", "//--------------------------Main----------------------------------", "string dataPath()", "{", "    string p(4096,'\\0');", "    readlink(\"/proc/self/exe\",&p[0],p.size()-1);", "    //readlink返回写了多少字节", "    //\"/proc/self/exe\"=文件g++后产生的exe位置(linux不产生exe，产生的文件没有后缀)", "    //readlink，先把\"/proc/self/exe\"改成本地地址，然后最多允许抄sizeof(buf)-1个字符到buf上。", "    //ssize_t是size_t的带符号版本,sizeof()很多返回的都是size_t", "    int n=p.rfind('/');", "    p=p.substr(0,n+1);//n是最后一个斜杠的下标，0-n有n+1个字符", "    return p+\"data.txt\";", "}", "//找路径", "void loadItems(string path,CommandList *L)", "{", "    ifstream in;", "    //设一个装文件位置类型的变量in(读)", "    in.open(path);//使得in对应着path这个文件", "    if(!in.is_open()){loadDefaults(L);return ;}", "    string line;", "    while(getline(in,line))", "    //从文件里一行一行getline，getline不要\\n", "    {", "        if(line.empty()==0&&line.back()=='\\r')", "        {line.pop_back();}", "        //调整windows格式", "", "        vector<string>parts=splitLine(line,'|');", "        //给getline的那一行分割了，拿id,cmd,note,tag四部分", "        ", "        int fid=0;", "        parseInt(parts[0],fid);", "        //把字符数字改成整数数字，存id里", "", "        addItem(L,parts[1],parts[2],parts[3],fid);", "    }", "    return ;", "}", "//把path路径里的东西搞到in里，然后一行一行看in的命令,把命令套链表上", "void saveItems(string path,CommandList *L)", "{", "    ofstream out;//ifstream是读,ofstream是写", "    out.open(path);//给变量整上具体地址,如果没有，就创建。", "    for(Node *p=L->dummyH->next;p!=L->dummyT;p=p->next)", "    {", "        out<<p->item.id<<'|'<<p->item.cmd<<'|'<<p->item.note<<'|'<<p->item.tag<<'\\n';", "        // out<< 为往文件里写什么什么东西。", "    }", "    return ;", "}"]}, "kmp_search.cpp": {"path": "backend/src/kmp_search.cpp", "lines": ["#include \"kmp_search.h\"", "", "vector<int>getnext(string p)", "{", "    vector<int>nxt(p.size(),0);", "    int index=0;", "    for(int i=1;i<(int)p.size();i++)", "    {", "        while(index>0&&p[i]!=p[index])", "        {", "            index=nxt[index-1];", "        }", "        if(p[i]==p[index])", "        {", "            index++;                                                                       ", "        }", "        nxt[i]=index;", "    }", "    return nxt;", "}", "//工具函数，获得next表kmpAll使用", "//a b a  c a b a,aba<->aba,", "//0 0 1  0 1 2 3", "//tail+'b',c!=b", "//aba(c)!=aba(b).3+1失效", "//看x+1的x是生效的，用nxt表", "//由于012=456,不可用，则查01是否=56", "//nxt[2]表是aba比对01,12,也就是01是否等于56", "//发现01!=12,也就是01!=56,", "//再缩水查0=2,也就是0=6.", "//a(b)==a(b)前缀1+1生效", "//再判断最后那个1是否生效", "//若生效,k++", "//b=b(if(p[i]==p[k])k++)", "//k=2", "//若失效k-- k=0;", "", "vector<int>kmpAll(string s,string p)", "{", "    vector<int>firstchar;", "    if(p.empty()==1) return firstchar;", "    vector<int>nxt=getnext(p);", "    int j=0;", "    for(int i=0;i<(int)s.size();i++){", "        while(j>0&&s[i]!=p[j])j=nxt[j-1];", "        if(s[i]==p[j])j++;", "        if(j==(int)p.size())", "        {", "            firstchar.push_back(i-j+1);", "            j=nxt[j-1];", "        }", "    }", "    return firstchar;", "}", "string highlight(string s,string p,string base)", "{", "    vector<bool>hit(s.size(),false);//hit是vector名,开文本串长度，全给false", "    for(int st:kmpAll(s,p))//st是首字符下标", "    {", "        for(int k=0;k<(int)p.size();k++)", "        {hit[st+k]=true;}//一号位是1,7,12", "        //p子串长度是2,则12 78 1213 false->true", "    }", "  string out;int last=-5;//一个永远不会遇见的数", "    for(int i=0;i<(int)s.size();i++)", "    {", "        unsigned char c=s[i];", "        if((c<0x80||c>0xBF)&&hit[i]!=last)", "        {", "            if(hit[i]==true) out+=RED;//底色+red=red", "            else{out+=RESET;//变成白颜色。", "            out+=base;}//如果是\"\"就是不变", "            //如果base=GRAY,就再染个灰色", "            last=hit[i];", "        }", "        //倘若遇到中文字符，有头字节尾巴字节", "        //此if判定是依旧循环走字节，如果走到尾字节就不加颜色码", "        out+=s[i];//染完色后把字符搞进去", "    }", "out+=RESET;//彻底搞完了变成空颜色", "return out;//返回染色串", "}", "//返回带颜色的串.|"]}, "Enter.cpp": {"path": "backend/src/Enter.cpp", "lines": ["#include \"Enter.h\"", "#include \"storage存放.h\"     //saveItems", "#include \"linux.h\"//rawOff,rawOn", "", "bool hasBar(string s)", "{", "    for(int i=0;i<(int)s.size();i++)", "    {", "        if(s[i]=='|')return true;", "    }", "    return false;", "}", "//用于addFLow,检查字段里有无切割符", "bool askLine(string input,string &out)", "{", "    out=\"\";//用户子串", "    string s;", "    cout<<\"\\n\\n\";", "    while(true)", "    {", "        cout<<\"\\r\\033[K\"<<input<<out<<flush;", "        // \\r=光标回到本行开头", "        KeyType k=readKey(s);", "        if(k==Quit)return false;", "        if(k==Enter)return true;", "        if(k==Char)out+=s;", "        else if(k==Back&&out.empty()==0)", "        {", "            int i=out.size()-1;", "            while(((unsigned char)out[i]&0xC0)==0x80)i--;", "            //如果是尾字节就下标-1", "            out.erase(i);", "        }", "    }", "}", "//从用户那里拿子串。", "", "void addFlow(App *app,string &msg)", "{", "    string cmd,note,tag;", "    if(askLine(\"命令: \",cmd)==0||cmd==\"\"){msg=\"已取消\";return;}", "    if(askLine(\"注释(可留空): \",note)==0){msg=\"已取消\";return;}", "    if(askLine(\"标签(默认 misc): \",tag)==0){msg=\"已取消\";return;}", "    if(tag==\"\")tag=\"misc\";", "    if(hasBar(cmd)||hasBar(note)||hasBar(tag))", "    {", "        msg=\"字段不能有|\";", "        return;", "    }", "    addItem(app->L,cmd,note,tag,-1);", "    saveItems(app->path,app->L);", "    msg=\"已添加\";", "}", "void delFlow(App *app,int id,string &msg)", "{", "    Node *p=findById(app->L,id);", "    if(p==nullptr)", "    {", "        msg=\"无此编号 #\"+to_string(id);", "        return;", "    }", "    removeNode(app->L,p);", "    saveItems(app->path,app->L);", "    msg=\"已删除 #\"+to_string(id);", "}", "void editFlow(App *app,int id,string &msg)", "{", "    Node *p=findById(app->L,id);", "    if(p==nullptr)", "    {", "        msg=\"没有编号 #\"+to_string(id);", "        return;", "    }", "", "    CommandItem nw=p->item;", "    string s;", "    if(askLine(\"新命令（回车不改）: \",s)==0){msg=\"已取消\";return;}", "    if(s!=\"\") nw.cmd=s;", "    if(askLine(\"新注释（回车不改）: \",s)==0){msg=\"已取消\";return;}", "    if(s!=\"\") nw.note=s;", "    if(askLine(\"新标签（回车不改）: \",s)==0){msg=\"已取消\";return;}", "    if(s!=\"\") nw.tag=s;", "", "    if(hasBar(nw.cmd)||hasBar(nw.note)||hasBar(nw.tag))", "    {", "        msg=\"字段里不能有 |\";", "        return;", "    }", "", "    p->item=nw;", "    saveItems(app->path,app->L);", "    msg=\"已修改 #\"+to_string(id);", "}", "", "void runCommand(App *app,string line,string &msg)", "{", "    int pos=line.find(' ');//find返回无符号下标", "    string name,rest=\"\";", "    if(pos==-1)//:add,找不到' '返回值是-1", "    {", "        name=line;", "    }", "    else// 空格前是命令名，空格后是剩下的", "    {", "        name=line.substr(0,pos);", "        rest=line.substr(pos+1);", "    }", "", "    if(name==\"add\")addFlow(app,msg);", "    else if(name==\"del\"||name==\"edit\")", "    {", "        int id=0;", "        parseInt(rest,id);", "        ", "        if(name==\"del\")delFlow(app,id,msg);", "        else editFlow(app,id,msg);", "    }", "    else msg=\"未知命令: \"+name;", "} ", "//跑冒号指令."]}, "linux.cpp": {"path": "frontend/src/linux.cpp", "lines": ["#include \"linux.h\"", "void rawOn()", "{", "    tcgetattr(STDIN_FILENO,&oldT);", "    //get attr获得属性", "    //STDIN_FILENO是管道,可以装,oldT是存放设置参数的地方,", "    termios t=oldT;                       ", "    t.c_lflag&=~(ICANON|ECHO|ISIG);", "    //给这三个属性全关了    ", "    //ICANON必须等回车再把字交给程序", "    //ECHO敲什么键，就往屏幕上显示什么字(按上下键不会出现^[[A)", "    //ISIG,按ctrl+C杀死程序", "", "    t.c_cc[VMIN]=1;//至少要用户输入1个字节再开始读      ", "", "    t.c_cc[VTIME]=0;//计时器，拿到字节以后直接开找", "", "    tcsetattr(STDIN_FILENO,TCSAFLUSH,&t);", "    //这是set,上面是get", "    //把VIM VTIME和那三个交付给状态t,状态t给到了零号管。", "    //TCSAFLUSH-立即生效+清空管道，TCSANOW立即生效", "}//状态更新", "", "void rawOff()", "{", "    tcsetattr(STDIN_FILENO,TCSAFLUSH,&oldT);", "}//状态返回", "", "KeyType readKey(string &s)", "{", "    unsigned char c=0;", "    if(read(STDIN_FILENO,&c,1)!=1)return Quit;", "    //read是linux的，(从哪读，存到哪，读几个)", "", "    if(c==3)return Quit;//Ctrl+C=3", "", "    if(c=='\\n'||c=='\\r')return Enter;//enter", "", "    if(c=='\\t')return Tab;//tab", "", "    if(c==127||c==8)return Back;//Backspace删除", "", "    if(c==27)//^[[A or ^[[B", "    {", "        fd_set s={0b0001};//勾选STDIN_FILENO管", "        timeval tv={0,0};//0s,0us", "        if(select(1,&s,0,0,&tv)==0)return Other;", "        //查1个管子，从s里拿管子,时间是tv，如果查到里面没东西了就是otherESC", "        //&必须要的原因是死规定", "        string a(2,0);//开两个位置放0", "        read(STDIN_FILENO,&a[0],2);", "        if(a==\"[A\")return Up;", "        if(a==\"[B\")return Down;", "        return Other;", "    }", "", "    if(c<32)return Other;//32是空格，0-31是控制键例如ctrl+A", "", "    //中文=UTF-8=2~4字节的字符", "    int len=1;", "    if(c>=0xF0)len=4;", "    //看看一个字符有多少个字节", "    //1字节 0xxx xxxx,2字节开头110x 3字节开头111x 4字节开头1111;", "    //多字节的尾巴，例如3字节的另两个字节都是10xx xxxx,", "    else if(c>=0xE0)len=3;", "    else if(c>=0xC0)len=2;", "", "    s=(char)c;//把第一个字节搞进去", "    for(int k=1;k<len;k++)//把剩下的字节搞进去,例如3字节的中文汉字", "    //就拼成了一个完整的字.", "    {", "        unsigned char d=0;", "        if(read(STDIN_FILENO,&d,1)!=1)break;", "        s+=(char)d;", "    }", "    return Char;", "}", "//读按键"]}, "screen.cpp": {"path": "frontend/src/screen.cpp", "lines": ["#include \"screen.h\"", "#include<bits/stdc++.h>", "using namespace std;", "", "void draw(App* app,string input,vector<Node*>&cand,int sel,string msg,int &top)", "{", "    cout<<\"\\033[H\";//清屏;", "    cout<<\"CmdBox ↑↓ 选择  Tab补全命令  Ctrl+C退出\\033[K\\n\";", "    cout<<\"数据文件:\"<<app->path<<\"\\033[K\\n\\033[K\\n\";", "    cout<<\"> \"<<input<<\"\\033[K\\n\";", "   ", "    if(sel<top)top=sel;", "    if(sel>=top+6)top=sel-5;", "", "    for(int i=top;i<(int)cand.size()&&i<top+6;i++)", "    //从top开始往下走，只画6行以内。", "    {", "        cout<<(i==sel?\"> \":\"  \")<<highlight(cand[i]->item.cmd,input,\"\")<<\"\\033[K\\n\"<<\"# \"<<highlight(cand[i]->item.note,input,GRAY)<<\"  [\"<<highlight(cand[i]->item.tag,input,\"\")<<\"]\"<<\" id:\"<<highlight(to_string(cand[i]->item.id),input,\"\")<<\"\\033[K\\n\"; ", "    }", "    if(msg!=\"\")cout<<\"\\033[K\\n\"<<msg<<\"\\033[K\\n\";", "    cout<<\"\\033[J\"<<flush;", "}", "//实时界面"]}};

    b.onclick = function(){ switchView(v.id); };
    box.appendChild(b);
  });

function chainOf(id){
  const out = []; let cur = id, guard = 0;
  while (cur && guard++ < 14){
    const d = BYID[cur];
    if (!d) break;
    out.unshift(d); cur = d.parent;
  }
  return out;
}
function descendantsOf(id){
  const out = {};
  (function walk(pid){
    Object.keys(BYID).forEach(function(k){
      if (BYID[k].parent === pid){ out[k] = 1; walk(k); }
    });
  })(id);
  return out;
}
function labelOf(n){ return (n.num ? n.num + ' ' : '') + n.label; }

function renderCrumbs(){
  crumbsEl.innerHTML = '';
  const v = VBY[S.view];
  const sep = function(){ crumbsEl.appendChild(h('span','sep','\u203A')); };
  const btn = function(label, act){
    const b = h('button', null, label); b.onclick = act; crumbsEl.appendChild(b);
  };
  const cur = function(label){ crumbsEl.appendChild(h('span','cur', label)); };

  const path = S.selected ? chainOf(S.selected) : (S.openGroup ? chainOf(S.openGroup) : []);
  const home = (S.view === 'main') ? 'main 时间线' : v.tab;
  if (!path.length){ cur(home); }
  else {
    btn(home, (S.view === 'main') ? jumpMain : resetView);
    path.forEach(function(n, i){
      sep();
      if (i === path.length - 1) cur(labelOf(n));
      else btn(labelOf(n), function(){ jumpToNode(n.id); });
    });
  }
  const tb = HIST.length > 1 ? HIST[HIST.length - 2] : null;
  backBtn.classList.toggle('ghost', !tb);

  backBtn.innerHTML = tb
    ? '\u2190 返回<span class="k">' + esc(shortLabel(tb.label)) + '</span>'
    : '\u2190 没有上一步';
  renderTrail();
}

function shortLabel(lab){
  const parts = String(lab).split(/\s+[\u203A\u00B7]\s+/);
  return parts[parts.length - 1];
}

function renderTrail(){
  if (!trailEl) return;
  trailEl.innerHTML = '';
  if (!HIST.length){
    trailEl.appendChild(h('span','tlab','这是第一步；点左边的节点，这里就会记下你走过的路'));
    return;
  }
  trailEl.appendChild(h('span','tlab','走过'));
  const from = Math.max(0, HIST.length - 6);
  if (from > 0) trailEl.appendChild(h('span','tarrow','\u2026'));
  HIST.forEach(function(st, i){
    if (i < from) return;
    const last = (i === HIST.length - 1);
    if (last){
      const cur = h('span','tchip tnow', shortLabel(st.label));
      cur.title = st.label;
      trailEl.appendChild(cur);
      trailEl.appendChild(h('span','tlab','现在'));
      return;
    }
    const c = h('button','tchip', shortLabel(st.label));
    c.title = '回到 ' + st.label;
    c.onclick = function(){ goToHist(i); };
    trailEl.appendChild(c);
    trailEl.appendChild(h('span','tarrow','\u203A'));
  });
}

/* ---------------- 自适应缩放 ---------------- */
function fitMap(){
  if (VBY[S.view] && VBY[S.view].render === 'play') return;
  if (!layEl || !fitEl) return;
  if (typeof treeEl.offsetWidth !== 'number' || typeof layEl.clientWidth !== 'number') return;
  fitEl.style.transform = 'none';
  fitEl.style.width = 'auto';
  fitEl.style.height = 'auto';
  mapEl.style.width = '';
  const w = treeEl.offsetWidth, h = treeEl.offsetHeight;
  const layW = layEl.clientWidth, layH = layEl.clientHeight;
  if (!w || !h || !layW || !layH) return;

  const padX = 46, padY = 42, codeMin = 330, gap = 16;
  const maxW = Math.max(300, layW - codeMin - gap);
  const availH = layH - padY;
  let k = Math.min(1, (maxW - padX) / w, availH / h);
  if (k < 0.9) k = 0.9;                 // 不再把字缩到看不清；放不下就在面板里滚
  k = Math.round(k * 100) / 100;
  const mapW = Math.min(maxW, Math.ceil(w * k) + padX);
  mapEl.style.width = Math.floor(mapW) + 'px';

  fitEl.style.transform = 'scale(' + k + ')';
  fitEl.style.width  = Math.ceil(w * k) + 'px';
  fitEl.style.height = Math.ceil(h * k) + 'px';
}

/* ---------------- 历史栈 ---------------- */
function describeState(){
  const v = VBY[S.view];
  const last = S.selected || S.openGroup;
  if (!last) return v.tab;
  return v.tab + ' \u00b7 ' + chainOf(last).map(labelOf).join(' \u203A ');
}
/* 走在同一条枝上换兄弟节点（1 点 2 点 3 点 4）不算新的一步，原地替换；
   从外面绕回来（点过的节点）就把后面全截掉。这样"走过"不会越点越长。 */
function histBase(st){ return st.selected || st.openGroup || null; }
function selfKey(st){
  const b = histBase(st);
  if (b) return 'n:' + b;
  return 'v:' + st.view;                       /* 只是把 main 展开/收起，不算换了地方 */
}
function levelKey(st){
  const b = histBase(st);
  if (!b) return 'v:' + st.view;
  return 'p:' + chainOf(b).slice(0, -1).map(function(x){ return x.id; }).join('>');
}
let PENDING = false;
let FORCE = false;
let LASTTAP = '';
function snapshot(){
  return { view:S.view, openRoot:S.openRoot, openGroup:S.openGroup,
           selected:S.selected, file:curFile,
           openKeys:JSON.parse(JSON.stringify(S.openKeys)),
           label:describeState() };
}
/* 操作时只打个标记，等这一帧重画完再记：记的是"人到哪儿了"，不是"从哪儿走的" */
function later(fn, ms){ if (typeof setTimeout === 'function') setTimeout(fn, ms); }

function pushHist(force){ PENDING = true; if (force) FORCE = true; }
function record(){
  if (!PENDING) return;
  PENDING = false;
  const force = FORCE; FORCE = false;
  const st = snapshot(), self = selfKey(st), lvl = levelKey(st);
  const n = HIST.length;
  if (n && selfKey(HIST[n - 1]) === self) return;                    // 没动
  // 同一层里换兄弟：覆盖（但跨视图的"跳转"要单独占一格，不然返回回不去）
  if (!force && n && levelKey(HIST[n - 1]) === lvl){ HIST[n - 1] = st; return; }
  for (let i = n - 2; i >= 0; i--){                                  // 绕回走过的老地方：截断
    if (selfKey(HIST[i]) === self){ HIST.length = i + 1; return; }
  }
  HIST.push(st);
  if (HIST.length > 10) HIST.shift();                                // 最多记 10 步
}
function restoreSt(st){
  PENDING = false;
  S.view = st.view; S.openRoot = st.openRoot;
  S.openGroup = st.openGroup; S.selected = st.selected;
  S.openKeys = st.openKeys || {};
  curFile = st.file;
  renderAll();
}
function goBack(){
  if (HIST.length < 2) return;
  HIST.pop();
  restoreSt(HIST[HIST.length - 1]);
}
function goToHist(i){
  if (i < 0 || i >= HIST.length) return;
  HIST.length = i + 1;
  restoreSt(HIST[i]);
}
function renderAll(){
  const v = VBY[S.view];

  }

  restoreKeyNodes();
  if (S.view === 'tut') renderSim(); else buildCode(curFile);

}

function renderChainForSelection(){
  if (!S.selected){ renderChain(null); return; }

/* ---------------- 左栏 ---------------- */
function buildTree(){
  const v = VBY[S.view];
  treeEl.innerHTML = '';
  Object.keys(REG).forEach(function(k){ delete REG[k]; });

  const row = h('div','row');
  const root = h('div','node root' + (!isStep(v) ? ' mod ' + v.id : '')
                         + (S.openRoot ? ' expanded' : ' pulse'));
  root.dataset.id = v.root.id;
  root.innerHTML = '<span class="rt">' + v.root.label + '</span>'
                 + '<span class="rs">' + v.root.sub + '</span>'
                 + '<span class="chev">\u203A</span>';
  root.onclick = function(ev){ ev.stopPropagation(); onRoot(); };
  REG[v.root.id] = root;
  row.appendChild(root);

  const kids = h('div','kids' + (S.openRoot ? '' : ' hidden'));
  kids.id = 'groupKids';
  row.appendChild(kids);
  v.groups.forEach(function(g, idx){ kids.appendChild(groupRow(v, g, idx)); });
  treeEl.appendChild(row);
  hintEl.style.opacity = S.openRoot ? '0' : '1';
}

function groupRow(v, g, idx){
  const r = h('div','row');
  const n = h('div','node anim ' + (isStep(v) ? 'phase' : 'file'));
  n.dataset.id = g.id;
  n.style.animationDelay = (idx * 55) + 'ms';
  n.innerHTML = isStep(v)
    ? '<span class="pnum">' + g.num + '</span>'
      + '<span class="ptxt"><b>' + g.label + '</b><i>' + g.sub + '</i></span>'
      + '<span class="chev">\u203A</span>'
    : '<span class="ficon">\u25A4</span>'
      + '<span class="ptxt"><b>' + g.label + '</b><i>' + g.sub + '</i></span>'
      + '<span class="chev">\u203A</span>';
  n.onclick = function(ev){ ev.stopPropagation(); onGroup(g.id); };
  REG[g.id] = n;
  r.appendChild(n);
  const ck = h('div','kids hidden');
  ck.dataset.for = g.id;
  r.appendChild(ck);
  return r;
}

function onRoot(){
  pushHist();
  S.openRoot = !S.openRoot;
  const k = document.getElementById('groupKids');
  if (k) k.classList.toggle('hidden', !S.openRoot);
  const rn = REG[VBY[S.view].root.id];
  if (rn){ rn.classList.toggle('expanded', S.openRoot); rn.classList.toggle('pulse', !S.openRoot); }
  if (!S.openRoot){ collapseAllGroups(); S.openGroup = null; S.selected = null; }
  hintEl.style.opacity = S.openRoot ? '0' : '1';
  renderChainForSelection();
  paint();
  renderCrumbs();
}

function onGroup(id){
  const g = BYID[id];
  if (S.openGroup === id){
    if (S.selected){ pushHist(); S.selected = null; }
    else { pushHist(); collapseGroup(id); S.openGroup = null; }
  } else {
    pushHist();
    collapseAllGroups();
    S.openGroup = id; S.selected = null;
    expandGroup(g);
    if (!isStep(S.view)) setFile(g.file);
  }
  renderChainForSelection();
  paint();
  renderCrumbs();
}

function expandGroup(g){
  const ck = document.querySelector('.kids[data-for="' + g.id + '"]');
  if (!ck) return;
  ck.innerHTML = '';
  g.items.forEach(function(it, idx){
    const r = h('div','row');
    const n = h('div','node anim ' + (isStep(g.view) ? 'step ' + it.layer : 'fn ' + g.layer));
    n.dataset.id = it.id;
    n.style.animationDelay = (idx * 55) + 'ms';
    if (isStep(g.view)){
      n.innerHTML = '<div class="srow">'
                  +   '<span class="snum ' + it.layer + '">' + it.num + '</span>'
                  +   '<span class="stitle">' + it.label + '</span>'
                  +   '<span class="chip ' + it.layer + '">' + LAYER[it.layer] + '</span>'
                  +   (hasKids(it.id) ? '<span class="kchev">\u203A</span>' : '')
                  + '</div>'
                  + '<code class="sfn">' + it.fn + '</code>'
                  + '<p class="sdesc">' + it.desc + '</p>';
    } else {
      const c = CALLS[it.label] || { callers:[] };
      const up = c.callers.length ? c.callers.join('、') : '没别人调';
      n.innerHTML = '<div class="frow">'
                  +   '<code class="fname">' + it.label + '</code>'
                  +   '<span class="fline">L' + it.code[0] + '\u2013' + it.code[1] + '</span>'
                  + '</div>'
                  + '<p class="fdesc">' + it.desc + '</p>'
                  + '<div class="fcalls" title="被这些函数调用：' + up + '">\u2191 <b>'
                  + up + '</b></div>';
    }
    if (hasKids(it.id)){
      n.classList.add('has-kids');
      if (S.openKeys[it.id]) n.classList.add('opened');
    }
    n.onclick = function(ev){ ev.stopPropagation(); onItem(it.id); };
    REG[it.id] = n;
    r.appendChild(n);
    if (hasKids(it.id)){
      const kc = h('div','kids' + (S.openKeys[it.id] ? '' : ' hidden'));
      kc.dataset.for = it.id;
      r.appendChild(kc);
      if (S.openKeys[it.id]) expandItemKids(it);
    }
    ck.appendChild(r);
  });
  ck.classList.remove('hidden');
}

function collapseGroup(id){
  const ck = document.querySelector('.kids[data-for="' + id + '"]');
  if (ck){ ck.innerHTML = ''; ck.classList.add('hidden'); }
}
function collapseAllGroups(){
  VBY[S.view].groups.forEach(function(g){ collapseGroup(g.id); });
}

function hasKids(id){
  const d = BYID[id];
  return !!(d && d.kids && d.kids.length);
}

function onItem(id){
  const it = BYID[id];
  if (!it) return;
  pushHist();
  if (S.selected === id && !hasKids(id)){
    S.selected = null;
  } else {
    S.selected = id;
    if (hasKids(id)){
      S.openKeys[id] = !S.openKeys[id];
      if (S.openKeys[id]) expandItemKids(it); else collapseKeys(id);
    }
    if (REG[id]) REG[id].classList.toggle('opened', !!S.openKeys[id]);
    if (it.file && it.file !== curFile) setFile(it.file);
  }
  renderChainForSelection();
  paint();
  renderCrumbs();
}

function onKey(id){ onItem(id); }

function expandItemKids(it){
  const kc = document.querySelector('.kids[data-for="' + it.id + '"]');
  if (!kc) return;
  kc.innerHTML = '';
  it.kids.forEach(function(k, idx){ kc.appendChild(keyRow(k, idx)); });
  kc.classList.remove('hidden');
}

function collapseKeys(id){
  const kc = document.querySelector('.kids[data-for="' + id + '"]');
  if (kc){ kc.innerHTML = ''; kc.classList.add('hidden'); }
  const it = BYID[id];
  (it && it.kids ? it.kids : []).forEach(function(k){
    S.openKeys[k.id] = false; collapseKeys(k.id);
  });
}

function restoreKeyNodes(){
  const v = VBY[S.view];
  if (!v || !v.groups) return;
  v.groups.forEach(function(g){
    if (S.openGroup !== g.id) return;
    (g.items || []).forEach(function(it){
      if (S.openKeys[it.id]) expandItemKids(it);
      (function walk(list){
        (list || []).forEach(function(k){
          if (S.openKeys[k.id]) expandItemKids(k);
          walk(k.kids);
        });
      })(it.kids);
    });
  });
}

function keyRow(k, idx){
  const r = h('div','row');
  const n = h('div','node anim knode ' + (k.layer || 'mn') + (S.openKeys[k.id] ? ' opened' : ''));
  n.dataset.id = k.id;
  n.style.animationDelay = (idx * 45) + 'ms';
  let chips = '';
  if (k.chips && k.chips.length){
    chips = '<div class="kchips">' + k.chips.map(function(c){
      return '<span class="kchip" data-jump="' + c.jump + '">' + c.label + '</span>';
    }).join('') + '</div>';
  }
  n.innerHTML = '<div class="khead"><b>' + k.label + '</b>'
              + ((k.kids && k.kids.length) ? '<span class="kchev">\u203A</span>' : '')
              + '</div>'
              + (k.fn ? '<code class="kfn">' + k.fn + '</code>' : '')
              + '<p class="kdesc">' + k.desc + '</p>' + chips;
  n.onclick = function(ev){
    ev.stopPropagation();
    const t = ev.target;
    if (t && t.dataset && t.dataset.jump){ jumpTo(t.dataset.jump); return; }
    onKey(k.id);
  };
  REG[k.id] = n;
  r.appendChild(n);
  if (k.kids && k.kids.length){
    const kc = h('div','kids' + (S.openKeys[k.id] ? '' : ' hidden'));
    kc.dataset.for = k.id;
    r.appendChild(kc);
    if (S.openKeys[k.id]) expandItemKids(k);
  }
  return r;
}

/* ---------------- 跳转 ---------------- */
function jumpTo(name){
  const f = CALLS[name];
  if (!f) return;
  pushHist(true);
  S.view = f.view; S.openRoot = true; S.openGroup = null; S.selected = null;
  curFile = f.file;
  buildTabs(); buildTree();
  S.openGroup = f.group;
  expandGroup(BYID[f.group]);
  S.selected = f.id;
  buildCode(f.file);
  renderChainForSelection();
  paint();
  renderCrumbs();
  const t = codeBody.querySelector('.ln.hot');
  if (t) t.scrollIntoView && t.scrollIntoView();
}

function jumpToNode(id){
  const d = BYID[id];
  if (!d) return;
  pushHist(true);
  if (d.view && S.view !== d.view){ S.view = d.view; curFile = d.file || curFile; }
  S.openRoot = true;
  chainOf(id).forEach(function(n){
    if (n.items) S.openGroup = n.id;
    if (n.kids) S.openKeys[n.id] = true;
  });
  if (d.parent) S.openKeys[d.parent] = true;
  S.selected = id;
  if (d.file) curFile = d.file;
  renderAll();
}

function resetView(){
  S.selected = null; S.openGroup = null;
  S.openRoot = !isStep(S.view);
  renderAll();
}

function jumpMain(){
  if (isStep(S.view) && !S.selected) return;
  pushHist();
  S.view = 'main'; S.openRoot = true; S.openGroup = null; S.selected = null;
  curFile = 'main.cpp';
  buildTabs(); buildTree();
  buildCode('main.cpp');
  renderChainForSelection();
  paint();
  renderCrumbs();
}

function switchView(id){
  if (S.view === id) return;
  pushHist();
  S.view = id; S.openRoot = !isStep(id);
  S.openGroup = null; S.selected = null;
  curFile = VBY[id].file || curFile;
  renderAll();
}

/* ---------------- 调用链 ---------------- */
function layerOf(name){
  return (CALLS[name] && CALLS[name].layer) ? CALLS[name].layer : '';
}

function renderChain(name){
  chainEl.innerHTML = '';
  if (!name) return;
  const f = CALLS[name];
  if (!f) return;
  chainEl.appendChild(h('span','cw','调用链'));
  const mk = function(n){
    const b = h('button','cchip ' + layerOf(n) + (n === name ? ' on' : ''), n);
    b.onclick = function(){ if (n === 'main') jumpMain(); else jumpTo(n); };
    return b;
  };
  f.chain.forEach(function(n, i){
    if (i) chainEl.appendChild(h('span','csep','\u203A'));
    chainEl.appendChild(mk(n));
  });
  if (f.callees.length){
    chainEl.appendChild(h('span','csep','|'));
    chainEl.appendChild(h('span','cw','\u2193 调用了'));
    f.callees.forEach(function(n, i){
      if (i) chainEl.appendChild(h('span','csep','\u00b7'));
      chainEl.appendChild(mk(n));
    });
  }
}

function stepFns(it){
  const out = [];
  const re = /([A-Za-z_][\w]*)\s*\(/g;
  let m;
  while ((m = re.exec(it.fn || '')) !== null){
    if (CALLS[m[1]] && out.indexOf(m[1]) < 0) out.push(m[1]);
  }
  return out;
}

function renderStepCalls(it){
  const names = stepFns(it);
  chainEl.innerHTML = '';
  if (!names.length) return;
  chainEl.appendChild(h('span','cw','本步调用'));
  names.forEach(function(n, i){
    if (i) chainEl.appendChild(h('span','csep','\u203A'));
    const b = h('button','cchip ' + layerOf(n), n);
    b.onclick = function(){ jumpTo(n); };
    chainEl.appendChild(b);
  });
}

/* ---------------- 上色 ---------------- */
function paint(){
  const v = VBY[S.view];
  if (v.render === 'intro') return;
  const all = Object.keys(REG).map(function(k){ return REG[k]; })
                    .filter(function(n){ return n && n.isConnected; });
  all.forEach(function(n){ n.classList.remove('dim','sel','open','path'); });
  if (v.render === 'play'){ renderSim(); return; }

  if (S.selected && S.selected !== LASTTAP){
    LASTTAP = S.selected;
    const el = REG[S.selected];
    if (el){
      el.classList.add('tap');
      later(function(){ el.classList.remove('tap'); }, 540);
    }
  }

  let range = null;
  let label = '全文 1\u2013' + SOURCES[curFile].lines.length + ' 行';

  if (S.selected){
    const d = BYID[S.selected];
    if (REG[S.selected]) REG[S.selected].classList.add('sel');
    const anc = {}, desc = descendantsOf(S.selected);
    chainOf(S.selected).forEach(function(n){ if (n.id !== S.selected) anc[n.id] = 1; });
    range = d.code;
    label = d.label + ' \u00b7 第 ' + range[0] + '\u2013' + range[1] + ' 行';
    if (REG[v.root.id]) REG[v.root.id].classList.add('path');
    all.forEach(function(x){
      const xid = x.dataset.id;
      if (xid === S.selected) return;
      if (anc[xid] || desc[xid] || xid === v.root.id){ x.classList.add('path'); return; }
      x.classList.add('dim');
    });
  }
  else if (S.openGroup){
    const g = BYID[S.openGroup];
    if (REG[g.id]) REG[g.id].classList.add('open');
    range = g.code;
    label = g.label + ' \u00b7 第 ' + range[0] + '\u2013' + range[1] + ' 行';
    if (REG[v.root.id]) REG[v.root.id].classList.add('path');
    const desc = descendantsOf(S.openGroup);
    all.forEach(function(x){
      const xid = x.dataset.id;
      if (xid === S.openGroup || desc[xid] || xid === v.root.id) return;
      x.classList.add('dim');
    });
  }
  applyCode(range, label);
  fitMap();
  if (S.selected && REG[S.selected] && REG[S.selected].scrollIntoView){
    REG[S.selected].scrollIntoView({block:'nearest', inline:'nearest'});
  }
  record();
}


/* ---------------- 模拟终端（使用教程） ---------------- */
function mq(str, q){
  str = String(str);
  if (!q){ return esc(str); }
  const i = str.toLowerCase().indexOf(String(q).toLowerCase());
  if (i < 0){ return esc(str); }
  return esc(str.slice(0, i)) + '<b class="hit">' + esc(str.slice(i, i + String(q).length))
       + '</b>' + esc(str.slice(i + String(q).length));
}

function termHTML(t){
  if (!t) return '<div class="term-empty">点左边的节点，这里给你看当时的屏幕</div>';
  return '<div class="term">'
       + '<div class="tbar"><i class="tdot r"></i><i class="tdot y"></i><i class="tdot g"></i>'
       + '<span class="ttitle">' + (t.mode === 'bash' ? 'bash' : 'cmdbox --pick') + '</span>'
       + ((t.keys && t.keys.length)
          ? '<span class="tkeys">' + t.keys.map(function(k){ return '<kbd>' + k + '</kbd>'; }).join('') + '</span>'
          : '')
       + '</div>'
       + (t.mode === 'bash' ? bashHTML(t)
          : (t.mode === 'search' ? searchHTML(t) : tuiHTML(t)))
       + '</div>';
}

function bashHTML(t){
  let s = '<div class="tline"><span class="tuser">cjx@daily</span><span class="tpath">:~$</span> '
        + '<span class="tin">' + esc(t.typed || '') + '</span><span class="tcur"></span></div>';
  if (t.say) s += '<div class="tsay">' + t.say + '</div>';
  return s;
}

function tuiHTML(t){
  let s = '<div class="tline tdim">CmdBox \u2191\u2193 选择  Tab补全命令  Ctrl+C退出</div>';
  s += '<div class="tline tdim">数据文件:~/cmdbox-flash-v1.0/data.txt</div>';
  s += '<div class="tgap"></div>';
  s += '<div class="tline"><span class="tprompt">&gt; </span>'
     + '<span class="tin">' + esc(t.typed || '') + '</span><span class="tcur"></span></div>';
  const cand = t.cand || [];
  const start = (t.sel >= 6) ? t.sel - 5 : 0;
  cand.slice(start, start + 6).forEach(function(r, k){
    const i = start + k, on = (i === t.sel);
    s += '<div class="trow' + (on ? ' on' : '') + '">'
       + '<span class="tsel">' + (on ? '&gt; ' : '\u00a0\u00a0') + '</span>'
       + '<span class="tcmd">' + mq(r.cmd, t.q) + '</span>'
       + '<span class="tnote">  # ' + esc(r.note) + '</span>'
       + '<span class="ttag">  [' + esc(r.tag) + ']</span>'
       + '<span class="tid"> id:' + mq(String(r.id), t.q) + '</span></div>';
  });
  if (t.msg) s += '<div class="tgap"></div><div class="tline tmsg">' + t.msg + '</div>';
  (t.trace || []).forEach(function(l){
    s += '<div class="tline tdone">' + esc(l) + '</div>';
  });
  if (t.ask) s += '<div class="tline task">' + esc(t.ask) + '<span class="tcur"></span></div>';
  return s;
}

function searchHTML(t){
  let s = '<div class="tline">搜索: <span class="tin">' + esc(t.typed || '全部') + '</span></div>';
  s += '<div class="tgap"></div>';
  (t.cand || []).forEach(function(r){
    s += '<div class="tline tcmd">' + mq(r.cmd, t.q) + '</div>';
    s += '<div class="tline tnote">\u00a0\u00a0# ' + mq(r.note, t.q) + '  [' + mq(r.tag, t.q) + ']</div>';
  });
  if (!(t.cand || []).length) s += '<div class="tline tdim">没有找到</div>';
  s += '<div class="tgap"></div><div class="tline tdim">按任意键返回...</div>';
  return s;
}
