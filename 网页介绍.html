  backBtn.innerHTML = tb
    ? '\u2190 返回<span class="k">' + esc(shortLabel(tb.label)) + '</span>'
    : '\u2190 没有上一步';
  renderTrail();
}

function shortLabel(lab){
  const parts = String(lab).split(/\s+[\u203A\u00B7]\s+/);
  return parts[parts.length - 1];
}

function renderTrail(){
  if (!trailEl) return;
  trailEl.innerHTML = '';
  if (!HIST.length){
    trailEl.appendChild(h('span','tlab','这是第一步；点左边的节点，这里就会记下你走过的路'));
    return;
  }
  trailEl.appendChild(h('span','tlab','走过'));
  const from = Math.max(0, HIST.length - 6);
  if (from > 0) trailEl.appendChild(h('span','tarrow','\u2026'));
  HIST.forEach(function(st, i){
    if (i < from) return;
    const last = (i === HIST.length - 1);
    if (last){
      const cur = h('span','tchip tnow', shortLabel(st.label));
      cur.title = st.label;
      trailEl.appendChild(cur);
      trailEl.appendChild(h('span','tlab','现在'));
      return;
    }
    const c = h('button','tchip', shortLabel(st.label));
    c.title = '回到 ' + st.label;
    c.onclick = function(){ goToHist(i); };
    trailEl.appendChild(c);
    trailEl.appendChild(h('span','tarrow','\u203A'));
  });
}

/* ---------------- 自适应缩放 ---------------- */
function fitMap(){
  if (VBY[S.view] && VBY[S.view].render === 'play') return;
  if (!layEl || !fitEl) return;
  if (typeof treeEl.offsetWidth !== 'number' || typeof layEl.clientWidth !== 'number') return;
  fitEl.style.transform = 'none';
  fitEl.style.width = 'auto';
  fitEl.style.height = 'auto';
  mapEl.style.width = '';
  const w = treeEl.offsetWidth, h = treeEl.offsetHeight;
  const layW = layEl.clientWidth, layH = layEl.clientHeight;
  if (!w || !h || !layW || !layH) return;

  const padX = 46, padY = 42, codeMin = 330, gap = 16;
  const mapW = Math.min(w + padX, Math.max(300, layW - codeMin - gap));
  mapEl.style.width = Math.floor(mapW) + 'px';

  const availW = mapW - padX, availH = layH - padY;
  let k = Math.min(1, availW / w, availH / h);
  if (k < 0.52) k = 0.52;
  k = Math.round(k * 100) / 100;
  fitEl.style.transform = 'scale(' + k + ')';
  fitEl.style.width  = Math.ceil(w * k) + 'px';
  fitEl.style.height = Math.ceil(h * k) + 'px';
}

/* ---------------- 历史栈 ---------------- */
function describeState(){
  const v = VBY[S.view];
  const last = S.selected || S.openGroup;
  if (!last) return v.tab;
  return v.tab + ' \u00b7 ' + chainOf(last).map(labelOf).join(' \u203A ');
}
/* 走在同一条枝上换兄弟节点（1 点 2 点 3 点 4）不算新的一步，原地替换；
   从外面绕回来（点过的节点）就把后面全截掉。这样"走过"不会越点越长。 */
function histBase(st){ return st.selected || st.openGroup || null; }
function selfKey(st){
  const b = histBase(st);
  if (b) return 'n:' + b;
  return 'v:' + st.view;                       /* 只是把 main 展开/收起，不算换了地方 */
}
function levelKey(st){
  const b = histBase(st);
  if (!b) return 'v:' + st.view;
  return 'p:' + chainOf(b).slice(0, -1).map(function(x){ return x.id; }).join('>');
}
let PENDING = false;
let FORCE = false;
let LASTTAP = '';
function snapshot(){
  return { view:S.view, openRoot:S.openRoot, openGroup:S.openGroup,
           selected:S.selected, file:curFile,
           openKeys:JSON.parse(JSON.stringify(S.openKeys)),
           label:describeState() };
}
/* 操作时只打个标记，等这一帧重画完再记：记的是"人到哪儿了"，不是"从哪儿走的" */
function later(fn, ms){ if (typeof setTimeout === 'function') setTimeout(fn, ms); }

function pushHist(force){ PENDING = true; if (force) FORCE = true; }
function record(){
  if (!PENDING) return;
  PENDING = false;
  const force = FORCE; FORCE = false;
  const st = snapshot(), self = selfKey(st), lvl = levelKey(st);
  const n = HIST.length;
  if (n && selfKey(HIST[n - 1]) === self) return;                    // 没动
  // 同一层里换兄弟：覆盖（但跨视图的"跳转"要单独占一格，不然返回回不去）
  if (!force && n && levelKey(HIST[n - 1]) === lvl){ HIST[n - 1] = st; return; }
  for (let i = n - 2; i >= 0; i--){                                  // 绕回走过的老地方：截断
    if (selfKey(HIST[i]) === self){ HIST.length = i + 1; return; }
  }
  HIST.push(st);
  if (HIST.length > 10) HIST.shift();                                // 最多记 10 步
}
function restoreSt(st){
  PENDING = false;
  S.view = st.view; S.openRoot = st.openRoot;
  S.openGroup = st.openGroup; S.selected = st.selected;
  S.openKeys = st.openKeys || {};
  curFile = st.file;
  renderAll();
}
function goBack(){
  if (HIST.length < 2) return;
  HIST.pop();
  restoreSt(HIST[HIST.length - 1]);
}
function goToHist(i){
  if (i < 0 || i >= HIST.length) return;
  HIST.length = i + 1;
  restoreSt(HIST[i]);
}
function renderAll(){
  const v = VBY[S.view];
  buildTabs();
  if (v.render === 'play'){
    mapEl.classList.add('play-on');
    buildPlay();
    renderSim();
    buildStat();
    renderCrumbs();
    return;
  }
  mapEl.classList.remove('play-on');
  buildTree();
  if (S.openGroup && v.render === 'tree') expandGroup(BYID[S.openGroup]);
  restoreKeyNodes();
  if (S.view === 'tut') renderSim(); else buildCode(curFile);
  renderChainForSelection();
  paint();
  renderCrumbs();
}

function renderChainForSelection(){
  if (!S.selected){ renderChain(null); return; }
  const it = BYID[S.selected];
  if (!it){ renderChain(null); return; }
  if (it.view === 'main') renderStepCalls(it);
  else renderChain(CALLS[it.label] ? it.label : null);
}

/* ---------------- 左栏 ---------------- */
function buildTree(){
  const v = VBY[S.view];
  treeEl.innerHTML = '';
  Object.keys(REG).forEach(function(k){ delete REG[k]; });

  const row = h('div','row');
  const root = h('div','node root' + (!isStep(v) ? ' mod ' + v.id : '')
                         + (S.openRoot ? ' expanded' : ' pulse'));
  root.dataset.id = v.root.id;
  root.innerHTML = '<span class="rt">' + v.root.label + '</span>'
                 + '<span class="rs">' + v.root.sub + '</span>'
                 + '<span class="chev">\u203A</span>';
  root.onclick = function(ev){ ev.stopPropagation(); onRoot(); };
  REG[v.root.id] = root;
  row.appendChild(root);

  const kids = h('div','kids' + (S.openRoot ? '' : ' hidden'));
  kids.id = 'groupKids';
  row.appendChild(kids);
  v.groups.forEach(function(g, idx){ kids.appendChild(groupRow(v, g, idx)); });
  treeEl.appendChild(row);
  hintEl.style.opacity = S.openRoot ? '0' : '1';
}

function groupRow(v, g, idx){
  const r = h('div','row');
  const n = h('div','node anim ' + (isStep(v) ? 'phase' : 'file'));
  n.dataset.id = g.id;
  n.style.animationDelay = (idx * 55) + 'ms';
  n.innerHTML = isStep(v)
    ? '<span class="pnum">' + g.num + '</span>'
      + '<span class="ptxt"><b>' + g.label + '</b><i>' + g.sub + '</i></span>'
      + '<span class="chev">\u203A</span>'
    : '<span class="ficon">\u25A4</span>'
      + '<span class="ptxt"><b>' + g.label + '</b><i>' + g.sub + '</i></span>'
      + '<span class="chev">\u203A</span>';
  n.onclick = function(ev){ ev.stopPropagation(); onGroup(g.id); };
  REG[g.id] = n;
  r.appendChild(n);
  const ck = h('div','kids hidden');
  ck.dataset.for = g.id;
  r.appendChild(ck);
  return r;
}

function onRoot(){
  pushHist();
  S.openRoot = !S.openRoot;
  const k = document.getElementById('groupKids');
  if (k) k.classList.toggle('hidden', !S.openRoot);
  const rn = REG[VBY[S.view].root.id];
  if (rn){ rn.classList.toggle('expanded', S.openRoot); rn.classList.toggle('pulse', !S.openRoot); }
  if (!S.openRoot){ collapseAllGroups(); S.openGroup = null; S.selected = null; }
  hintEl.style.opacity = S.openRoot ? '0' : '1';
  renderChainForSelection();
  paint();
  renderCrumbs();
}

function onGroup(id){
  const g = BYID[id];
  if (S.openGroup === id){
    if (S.selected){ pushHist(); S.selected = null; }
    else { pushHist(); collapseGroup(id); S.openGroup = null; }
  } else {
    pushHist();
    collapseAllGroups();
    S.openGroup = id; S.selected = null;
    expandGroup(g);
    if (!isStep(S.view)) setFile(g.file);
  }
  renderChainForSelection();
  paint();
  renderCrumbs();
}

function expandGroup(g){
  const ck = document.querySelector('.kids[data-for="' + g.id + '"]');
  if (!ck) return;
  ck.innerHTML = '';
  g.items.forEach(function(it, idx){
    const r = h('div','row');
    const n = h('div','node anim ' + (isStep(g.view) ? 'step ' + it.layer : 'fn ' + g.layer));
    n.dataset.id = it.id;
    n.style.animationDelay = (idx * 55) + 'ms';
    if (isStep(g.view)){
      n.innerHTML = '<div class="srow">'
                  +   '<span class="snum ' + it.layer + '">' + it.num + '</span>'
                  +   '<span class="stitle">' + it.label + '</span>'
                  +   '<span class="chip ' + it.layer + '">' + LAYER[it.layer] + '</span>'
                  +   (hasKids(it.id) ? '<span class="kchev">\u203A</span>' : '')
                  + '</div>'
                  + '<code class="sfn">' + it.fn + '</code>'
                  + '<p class="sdesc">' + it.desc + '</p>';
    } else {
      const c = CALLS[it.label] || { callers:[] };
      const up = c.callers.length ? c.callers.join('、') : '没别人调';
      n.innerHTML = '<div class="frow">'
                  +   '<code class="fname">' + it.label + '</code>'
                  +   '<span class="fline">L' + it.code[0] + '\u2013' + it.code[1] + '</span>'
                  + '</div>'
                  + '<p class="fdesc">' + it.desc + '</p>'
                  + '<div class="fcalls" title="被这些函数调用：' + up + '">\u2191 <b>'
                  + up + '</b></div>';
    }
    if (hasKids(it.id)){
      n.classList.add('has-kids');
      if (S.openKeys[it.id]) n.classList.add('opened');
    }
    n.onclick = function(ev){ ev.stopPropagation(); onItem(it.id); };
    REG[it.id] = n;
    r.appendChild(n);
    if (hasKids(it.id)){
      const kc = h('div','kids' + (S.openKeys[it.id] ? '' : ' hidden'));
      kc.dataset.for = it.id;
      r.appendChild(kc);
      if (S.openKeys[it.id]) expandItemKids(it);
    }
    ck.appendChild(r);
  });
  ck.classList.remove('hidden');
}

function collapseGroup(id){
  const ck = document.querySelector('.kids[data-for="' + id + '"]');
  if (ck){ ck.innerHTML = ''; ck.classList.add('hidden'); }
}
function collapseAllGroups(){
  VBY[S.view].groups.forEach(function(g){ collapseGroup(g.id); });
}

function hasKids(id){
  const d = BYID[id];
  return !!(d && d.kids && d.kids.length);
}

function onItem(id){
  const it = BYID[id];
  if (!it) return;
  pushHist();
  if (S.selected === id && !hasKids(id)){
    S.selected = null;
  } else {
    S.selected = id;
    if (hasKids(id)){
      S.openKeys[id] = !S.openKeys[id];
      if (S.openKeys[id]) expandItemKids(it); else collapseKeys(id);
    }
    if (REG[id]) REG[id].classList.toggle('opened', !!S.openKeys[id]);
    if (it.file && it.file !== curFile) setFile(it.file);
  }
  renderChainForSelection();
  paint();
  renderCrumbs();
}

function onKey(id){ onItem(id); }

function expandItemKids(it){
  const kc = document.querySelector('.kids[data-for="' + it.id + '"]');
  if (!kc) return;
  kc.innerHTML = '';
  it.kids.forEach(function(k, idx){ kc.appendChild(keyRow(k, idx)); });
  kc.classList.remove('hidden');
}

function collapseKeys(id){
  const kc = document.querySelector('.kids[data-for="' + id + '"]');
  if (kc){ kc.innerHTML = ''; kc.classList.add('hidden'); }
  const it = BYID[id];
  (it && it.kids ? it.kids : []).forEach(function(k){
    S.openKeys[k.id] = false; collapseKeys(k.id);
  });
}

function restoreKeyNodes(){
  const v = VBY[S.view];
  if (!v || !v.groups) return;
  v.groups.forEach(function(g){
    if (S.openGroup !== g.id) return;
    (g.items || []).forEach(function(it){
      if (S.openKeys[it.id]) expandItemKids(it);
      (function walk(list){
        (list || []).forEach(function(k){
          if (S.openKeys[k.id]) expandItemKids(k);
          walk(k.kids);
        });
      })(it.kids);
    });
  });
}

function keyRow(k, idx){
  const r = h('div','row');
  const n = h('div','node anim knode ' + (k.layer || 'mn') + (S.openKeys[k.id] ? ' opened' : ''));
  n.dataset.id = k.id;
  n.style.animationDelay = (idx * 45) + 'ms';
  let chips = '';
  if (k.chips && k.chips.length){
    chips = '<div class="kchips">' + k.chips.map(function(c){
      return '<span class="kchip" data-jump="' + c.jump + '">' + c.label + '</span>';
    }).join('') + '</div>';
  }
  n.innerHTML = '<div class="khead"><b>' + k.label + '</b>'
              + ((k.kids && k.kids.length) ? '<span class="kchev">\u203A</span>' : '')
              + '</div>'
              + (k.fn ? '<code class="kfn">' + k.fn + '</code>' : '')
              + '<p class="kdesc">' + k.desc + '</p>' + chips;
  n.onclick = function(ev){
    ev.stopPropagation();
    const t = ev.target;
    if (t && t.dataset && t.dataset.jump){ jumpTo(t.dataset.jump); return; }
    onKey(k.id);
  };
  REG[k.id] = n;
  r.appendChild(n);
  if (k.kids && k.kids.length){
    const kc = h('div','kids' + (S.openKeys[k.id] ? '' : ' hidden'));
    kc.dataset.for = k.id;
    r.appendChild(kc);
    if (S.openKeys[k.id]) expandItemKids(k);
  }
  return r;
}

/* ---------------- 跳转 ---------------- */
function jumpTo(name){
  const f = CALLS[name];
  if (!f) return;
  pushHist(true);
  S.view = f.view; S.openRoot = true; S.openGroup = null; S.selected = null;
  curFile = f.file;
  buildTabs(); buildTree();
  S.openGroup = f.group;
  expandGroup(BYID[f.group]);
  S.selected = f.id;
  buildCode(f.file);
  renderChainForSelection();
  paint();
  renderCrumbs();
  const t = codeBody.querySelector('.ln.hot');
  if (t) t.scrollIntoView && t.scrollIntoView();
}

function jumpToNode(id){
  const d = BYID[id];
  if (!d) return;
  pushHist(true);
  if (d.view && S.view !== d.view){ S.view = d.view; curFile = d.file || curFile; }
  S.openRoot = true;
  chainOf(id).forEach(function(n){
    if (n.items) S.openGroup = n.id;
    if (n.kids) S.openKeys[n.id] = true;
  });
  if (d.parent) S.openKeys[d.parent] = true;
  S.selected = id;
  if (d.file) curFile = d.file;
  renderAll();
}

function resetView(){
  S.selected = null; S.openGroup = null;
  S.openRoot = !isStep(S.view);
  renderAll();
}

function jumpMain(){
  if (isStep(S.view) && !S.selected) return;
  pushHist();
  S.view = 'main'; S.openRoot = true; S.openGroup = null; S.selected = null;
  curFile = 'main.cpp';
  buildTabs(); buildTree();
  buildCode('main.cpp');
  renderChainForSelection();
  paint();
  renderCrumbs();
}

function switchView(id){
  if (S.view === id) return;
  pushHist();
  S.view = id; S.openRoot = !isStep(id);
  S.openGroup = null; S.selected = null;
  curFile = VBY[id].file;
  renderAll();
}

/* ---------------- 调用链 ---------------- */
function layerOf(name){
  return (CALLS[name] && CALLS[name].layer) ? CALLS[name].layer : '';
}

function renderChain(name){
  chainEl.innerHTML = '';
  if (!name) return;
  const f = CALLS[name];
  if (!f) return;
  chainEl.appendChild(h('span','cw','调用链'));
  const mk = function(n){
    const b = h('button','cchip ' + layerOf(n) + (n === name ? ' on' : ''), n);
    b.onclick = function(){ if (n === 'main') jumpMain(); else jumpTo(n); };
    return b;
  };
  f.chain.forEach(function(n, i){
    if (i) chainEl.appendChild(h('span','csep','\u203A'));
    chainEl.appendChild(mk(n));
  });
  if (f.callees.length){
    chainEl.appendChild(h('span','csep','|'));
    chainEl.appendChild(h('span','cw','\u2193 调用了'));
    f.callees.forEach(function(n, i){
      if (i) chainEl.appendChild(h('span','csep','\u00b7'));
      chainEl.appendChild(mk(n));
    });
  }
}

function stepFns(it){
  const out = [];
  const re = /([A-Za-z_][\w]*)\s*\(/g;
  let m;
  while ((m = re.exec(it.fn || '')) !== null){
    if (CALLS[m[1]] && out.indexOf(m[1]) < 0) out.push(m[1]);
  }
  return out;
}

function renderStepCalls(it){
  const names = stepFns(it);
  chainEl.innerHTML = '';
  if (!names.length) return;
  chainEl.appendChild(h('span','cw','本步调用'));
  names.forEach(function(n, i){
    if (i) chainEl.appendChild(h('span','csep','\u203A'));
    const b = h('button','cchip ' + layerOf(n), n);
    b.onclick = function(){ jumpTo(n); };
    chainEl.appendChild(b);
  });
}

/* ---------------- 上色 ---------------- */
function paint(){
  const v = VBY[S.view];
  const all = Object.keys(REG).map(function(k){ return REG[k]; })
                    .filter(function(n){ return n && n.isConnected; });
  all.forEach(function(n){ n.classList.remove('dim','sel','open','path'); });
  if (v.render === 'play'){ renderSim(); return; }

  if (S.selected && S.selected !== LASTTAP){
    LASTTAP = S.selected;
    const el = REG[S.selected];
    if (el){
      el.classList.add('tap');
      later(function(){ el.classList.remove('tap'); }, 540);
    }
  }

  let range = null;
  let label = '全文 1\u2013' + SOURCES[curFile].lines.length + ' 行';

  if (S.selected){
    const d = BYID[S.selected];
    if (REG[S.selected]) REG[S.selected].classList.add('sel');
    const anc = {}, desc = descendantsOf(S.selected);
    chainOf(S.selected).forEach(function(n){ if (n.id !== S.selected) anc[n.id] = 1; });
    range = d.code;
    label = d.label + ' \u00b7 第 ' + range[0] + '\u2013' + range[1] + ' 行';
    if (REG[v.root.id]) REG[v.root.id].classList.add('path');
    all.forEach(function(x){
      const xid = x.dataset.id;
      if (xid === S.selected) return;
      if (anc[xid] || desc[xid] || xid === v.root.id){ x.classList.add('path'); return; }
      x.classList.add('dim');
    });
  }
  else if (S.openGroup){
    const g = BYID[S.openGroup];
    if (REG[g.id]) REG[g.id].classList.add('open');
    range = g.code;
    label = g.label + ' \u00b7 第 ' + range[0] + '\u2013' + range[1] + ' 行';
    if (REG[v.root.id]) REG[v.root.id].classList.add('path');
    const desc = descendantsOf(S.openGroup);
    all.forEach(function(x){
      const xid = x.dataset.id;
      if (xid === S.openGroup || desc[xid] || xid === v.root.id) return;
      x.classList.add('dim');
    });
  }
  applyCode(range, label);
  fitMap();
  record();
}


/* ---------------- 模拟终端（使用教程） ---------------- */
function mq(str, q){
  str = String(str);
  if (!q){ return esc(str); }
  const i = str.toLowerCase().indexOf(String(q).toLowerCase());
  if (i < 0){ return esc(str); }
  return esc(str.slice(0, i)) + '<b class="hit">' + esc(str.slice(i, i + String(q).length))
       + '</b>' + esc(str.slice(i + String(q).length));
}

function termHTML(t){
  if (!t) return '<div class="term-empty">点左边的节点，这里给你看当时的屏幕</div>';
  return '<div class="term">'
       + '<div class="tbar"><i class="tdot r"></i><i class="tdot y"></i><i class="tdot g"></i>'
       + '<span class="ttitle">' + (t.mode === 'bash' ? 'bash' : 'cmdbox --pick') + '</span>'
       + ((t.keys && t.keys.length)
          ? '<span class="tkeys">' + t.keys.map(function(k){ return '<kbd>' + k + '</kbd>'; }).join('') + '</span>'
          : '')
       + '</div>'
       + (t.mode === 'bash' ? bashHTML(t)
          : (t.mode === 'search' ? searchHTML(t) : tuiHTML(t)))
       + '</div>';
}

function bashHTML(t){
  let s = '<div class="tline"><span class="tuser">cjx@daily</span><span class="tpath">:~$</span> '
        + '<span class="tin">' + esc(t.typed || '') + '</span><span class="tcur"></span></div>';
  if (t.say) s += '<div class="tsay">' + t.say + '</div>';
  return s;
}

function tuiHTML(t){
  let s = '<div class="tline tdim">CmdBox \u2191\u2193 选择  Tab补全命令  Enter搜索  :help帮助  Ctrl+C退出</div>';
  s += '<div class="tline tdim">数据文件:~/cmdbox/data.txt</div>';
  s += '<div class="tgap"></div>';
  s += '<div class="tline"><span class="tprompt">&gt; </span>'
     + '<span class="tin">' + esc(t.typed || '') + '</span><span class="tcur"></span></div>';
  const cand = t.cand || [];
  const start = (t.sel >= 6) ? t.sel - 5 : 0;
  cand.slice(start, start + 6).forEach(function(r, k){
    const i = start + k, on = (i === t.sel);
    s += '<div class="trow' + (on ? ' on' : '') + '">'
       + '<span class="tsel">' + (on ? '&gt; ' : '\u00a0\u00a0') + '</span>'
       + '<span class="tcmd">' + mq(r.cmd, t.q) + '</span>'
       + '<span class="tnote">  # ' + esc(r.note) + '</span>'
       + '<span class="ttag">  [' + esc(r.tag) + ']</span>'
       + '<span class="tid"> id:' + r.id + '</span></div>';
  });
  if (t.msg) s += '<div class="tgap"></div><div class="tline tmsg">' + t.msg + '</div>';
  (t.trace || []).forEach(function(l){
    s += '<div class="tline tdone">' + esc(l) + '</div>';
  });
  if (t.ask) s += '<div class="tline task">' + esc(t.ask) + '<span class="tcur"></span></div>';
  return s;
}

function searchHTML(t){
  let s = '<div class="tline">搜索: <span class="tin">' + esc(t.typed || '全部') + '</span></div>';
  s += '<div class="tgap"></div>';
  (t.cand || []).forEach(function(r){
    s += '<div class="tline tcmd">' + mq(r.cmd, t.q) + '</div>';
    s += '<div class="tline tnote">\u00a0\u00a0# ' + mq(r.note, t.q) + '  [' + mq(r.tag, t.q) + ']</div>';
  });
  if (!(t.cand || []).length) s += '<div class="tline tdim">没有找到</div>';
  s += '<div class="tgap"></div><div class="tline tdim">按任意键返回...</div>';
  return s;
}


/* ---------------- 功能试用：CmdBox 模拟器 ---------------- */
const SIM = { mode:'pick', input:'', sel:0, msg:'', ask:'', done:'',
              askIdx:0, draft:{}, trace:[] };
let LIVE = ROWS.slice();

function simResetLIVE(){ LIVE = ROWS.slice(); }

/* 真程序 addFlow 的顺序：命令 → 注释（可留空） → 标签（默认 misc） */
const ASK_FIELDS = [
  {key:'cmd',  prompt:'命令: ',            empty:null},
  {key:'note', prompt:'注释（可留空）: ',  empty:''},
  {key:'tag',  prompt:'标签（默认 misc）: ', empty:'misc'}
];

function simAskPrompt(){
  const f = ASK_FIELDS[Math.min(SIM.askIdx, ASK_FIELDS.length - 1)];
  return f ? f.prompt : '';
}

function simPick(q){
  if (!q) return LIVE.slice();
  return LIVE.filter(function(r){ return r.cmd.indexOf(q) === 0; });
}
function simFull(q){
  if (!q) return LIVE.slice();
  return LIVE.filter(function(r){
    return (r.cmd + '\n' + r.note + '\n' + r.tag).indexOf(q) >= 0;
  });
}

function simState(){
  if (SIM.mode === 'exit'){
    return {mode:'bash', typed: SIM.done,
            say: SIM.done ? '（已退出 CmdBox，这条命令已经躺在命令行里，还没执行）'
                          : '（已退出 CmdBox，命令行一个字都没动）'};
  }
  if (SIM.mode === 'search'){
    return {mode:'search', typed: SIM.input, q: SIM.input, cand: simFull(SIM.input)};
  }
  if (SIM.mode === 'ask'){
    return {mode:'tui', typed: SIM.input, q:'', sel:0, cand:[], msg:'',
            trace: SIM.trace, ask: simAskPrompt() + SIM.ask};
  }
  return {mode:'tui', typed: SIM.input, q: SIM.input, sel: SIM.sel,
          cand: simPick(SIM.input), msg: SIM.msg};
}

function simHint(){
  if (SIM.mode === 'exit') return '已退出：随便点个键、或点「重置」从头再来';
  if (SIM.mode === 'search') return '搜索界面：按任意键（或点任意键）回到列表';
  if (SIM.mode === 'ask') return '第 ' + (SIM.askIdx + 1) + '/3 个字段：' + simAskPrompt();
  if (!simPick(SIM.input).length) return '没有匹配的命令';
  return '选第 ' + (SIM.sel + 1) + ' 条，共 ' + simPick(SIM.input).length + ' 条';
}

function simEnter(){
  const s = SIM.input;
  if (s.charAt(0) === ':'){
    const body = s.slice(1);
    const sp = body.indexOf(' ');
    const name = sp < 0 ? body : body.slice(0, sp);
    const rest = sp < 0 ? '' : body.slice(sp + 1);
    if (name === 'quit'){ SIM.mode = 'exit'; SIM.done = ''; SIM.input = ''; return; }
    if (name === 'add'){ SIM.mode = 'ask'; SIM.ask = ''; return; }
    if (name === 'list'){ SIM.input = ''; SIM.mode = 'search'; return; }
    SIM.input = ''; SIM.sel = 0; SIM.msg = '';   // 真程序：Enter 之后 input 清空
    if (name === 'help'){ SIM.msg = ':list 列出全部 | :add 添加 | :edit 编号 修改 | :del 编号 删除 | :quit 退出'; return; }
    if (name === 'del'){
      const id = rest ? parseInt(rest, 10) : 0;
      const at = LIVE.findIndex(function(r){ return r.id === id; });
      if (at < 0){ SIM.msg = '无此编号 #' + id; return; }
      LIVE.splice(at, 1);
      SIM.msg = '已删除 #' + id + '（演示，不会真改 data.txt）';
      return;
    }
    if (name === 'edit'){
      const id = rest ? parseInt(rest, 10) : 0;
      const has = LIVE.some(function(r){ return r.id === id; });
      SIM.msg = has ? ('编号 #' + id + ' 在这儿（改的界面演示里略过）') : ('没有编号 #' + id);
      return;
    }
    SIM.msg = '未知命令: ' + name;
    return;
  }
  SIM.mode = 'search';
}

const KEYLABEL = {Up:'\u2191', Down:'\u2193', Tab:'Tab', Back:'Backspace',
                  Enter:'Enter', CtrlC:'Ctrl+C', ' ':'\u7a7a\u683c', ':':':'};

function flashKey(k){
  const lab = Object.prototype.hasOwnProperty.call(KEYLABEL, k) ? KEYLABEL[k] : k;
  const boxes = [document.getElementById('pkb'), document.getElementById('pspec')];
  for (let b = 0; b < boxes.length; b++){
    const box = boxes[b];
    if (!box || !box.children) continue;
    for (let i = 0; i < box.children.length; i++){
      const row = box.children[i];
      const list = (row.children && row.children.length) ? row.children : [row];
      for (let j = 0; j < list.length; j++){
        const el = list[j];
        if (el && el.textContent === lab){
          el.classList.add('flash');
          (function(e){ later(function(){ e.classList.remove('flash'); }, 170); })(el);
          return;
        }
      }
    }
  }
}

function simKey(k){
  flashKey(k);
  if (SIM.mode === 'search'){
    SIM.mode = 'pick'; SIM.input = ''; SIM.sel = 0; SIM.msg = '';
    simAfter(); return;
  }
  if (SIM.mode === 'exit'){ simReset(); return; }

  if (SIM.mode === 'ask'){
    if (k === 'Enter'){
      const f = ASK_FIELDS[SIM.askIdx];
      const v = SIM.ask;
      if (f.key === 'cmd' && v === ''){          // 真程序：命令留空=取消
        SIM.mode = 'pick'; SIM.msg = '已取消'; SIM.ask = ''; SIM.trace = [];
        SIM.input = ''; SIM.sel = 0;
        simAfter(); return;
      }
      SIM.draft[f.key] = (v === '' && f.empty !== null) ? f.empty : v;
      SIM.trace.push(f.prompt + v);
      SIM.ask = '';
      SIM.askIdx++;
      if (SIM.askIdx >= ASK_FIELDS.length){      // 三个字段都问完了
        const bad = ['cmd','note','tag'].some(function(x){ return SIM.draft[x].indexOf('|') >= 0; });
        if (bad){
          SIM.msg = '字段不能有|';
        } else {
          const nid = LIVE.reduce(function(m, r){ return Math.max(m, r.id); }, 0) + 1;
          LIVE.push({id:nid, cmd:SIM.draft.cmd, note:SIM.draft.note, tag:SIM.draft.tag});
          SIM.msg = '已添加 #' + nid + '（演示，不会写进 data.txt）';
        }
        SIM.mode = 'pick'; SIM.askIdx = 0; SIM.draft = {}; SIM.trace = [];
        SIM.input = ''; SIM.sel = 0;
      }
    } else if (k === 'Back'){
      SIM.ask = SIM.ask.slice(0, -1);
    } else if (k === 'CtrlC'){
      SIM.mode = 'exit'; SIM.done = '';
    } else if (k === 'Tab'){
      /* askLine 里 Tab 不是补全，什么也不做 */
    } else if (k.length === 1){
      SIM.ask += k;
    }
    simAfter(); return;
  }

  const cand = simPick(SIM.input);
  if (k === 'Up'){
    if (SIM.sel > 0) SIM.sel--;
  } else if (k === 'Down'){
    if (SIM.sel + 1 < cand.length) SIM.sel++;
  } else if (k === 'Tab'){
    if (cand.length){                      // --pick：Tab = 选中并立刻退回 bash
      SIM.done = cand[Math.min(SIM.sel, cand.length - 1)].cmd;
      SIM.mode = 'exit'; SIM.msg = ''; SIM.input = ''; SIM.sel = 0;
      simAfter(); return;
    }
  } else if (k === 'Back'){
    SIM.input = SIM.input.slice(0, -1);
    SIM.sel = 0; SIM.msg = '';
  } else if (k === 'CtrlC'){
    SIM.mode = 'exit'; SIM.done = '';
  } else if (k === 'Enter'){
    simEnter();
  } else if (k.length === 1){
    SIM.input += k; SIM.sel = 0; SIM.msg = '';
  }
  simAfter();
}

function simReset(){
  SIM.mode = 'pick'; SIM.input = ''; SIM.sel = 0; SIM.msg = ''; SIM.ask = ''; SIM.done = '';
  SIM.askIdx = 0; SIM.draft = {}; SIM.trace = [];
  simResetLIVE();
  simAfter();
}

function renderSim(){
  const st = simState();
  fileNameEl.textContent = '模拟终端';
  filePathEl.textContent = (st.mode === 'bash') ? 'bash' : 'cmdbox --pick';
  rangeLabel.textContent = simHint();
  codeBody.innerHTML = termHTML(st);
  codeBody.scrollTop = 0;
  const rbar = document.getElementById('rbar');
  if (rbar) rbar.style.display = 'none';
  if (typeBoxEl){
    const v = (SIM.mode === 'ask') ? SIM.ask : (SIM.mode === 'pick' ? SIM.input : '');
    if (typeBoxEl.value !== v) typeBoxEl.value = v;
  }
  if (pstateEl) pstateEl.textContent = simHint();
  renderChain(null);
}

function simAfter(){ renderSim(); record(); }

function buildPlay(){
  if (buildPlay.done) return;
  buildPlay.done = true;

  const q = document.getElementById('pquick');
  QUICK.forEach(function(w){
    const b = h('button', '', w);
    b.onclick = function(){
      if (SIM.mode === 'exit') simReset();
      SIM.mode = 'pick'; SIM.input = w; SIM.sel = 0; SIM.msg = '';
      SIM.ask = ''; SIM.askIdx = 0; SIM.draft = {}; SIM.trace = [];
      simAfter();
    };
    q.appendChild(b);
  });

  const kb = document.getElementById('pkb');
  ['1234567890', 'qwertyuiop', 'asdfghjkl', 'zxcvbnm'].forEach(function(line){
    const r = h('div', 'krow');
    Array.prototype.slice.call(line).forEach(function(ch){
      const b = h('button', 'k', ch);
      b.onclick = function(){ simKey(ch); };
      r.appendChild(b);
    });
    kb.appendChild(r);
  });

  const sp = document.getElementById('pspec');
  [['↑', 'Up'], ['↓', 'Down'], ['Tab', 'Tab'], ['Backspace', 'Back'],
   ['Enter', 'Enter'], ['Ctrl+C', 'CtrlC'], [':', ':'], ['空格', ' '],
   ['清空', 'Clear']].forEach(function(pair){
    const b = h('button', 'k' + (pair[1] === 'CtrlC' ? ' warnk' : ''), pair[0]);
    b.onclick = function(){
      if (pair[1] === 'Clear'){
        if (SIM.mode === 'ask'){ SIM.ask = ''; }
        else { SIM.input = ''; SIM.sel = 0; SIM.msg = ''; }
        simAfter();
      }
      else simKey(pair[1]);
    };
    sp.appendChild(b);
  });

  document.getElementById('pReset').onclick = simReset;
  if (typeBoxEl){
    typeBoxEl.addEventListener('keydown', function(ev){
      const map = { Enter:'Enter', Tab:'Tab', ArrowUp:'Up', ArrowDown:'Down' };
      if (map[ev.key]){
        if (ev.preventDefault) ev.preventDefault();
        simKey(map[ev.key]);
        return;
      }
      if (ev.key === 'Backspace' || ev.key === 'Escape'){
        /* Backspace 交给原生输入，事件里再同步；Esc 当退出 */
        if (ev.key === 'Escape'){ if (ev.preventDefault) ev.preventDefault(); simKey('CtrlC'); }
      }
    });
    typeBoxEl.addEventListener('input', function(){
      let v = typeBoxEl.value;
      const prev = (SIM.mode === 'ask') ? SIM.ask : SIM.input;
      if (SIM.mode === 'search'){
        SIM.mode = 'pick'; SIM.input = ''; SIM.sel = 0; SIM.msg = ''; SIM.ask = '';
        simAfter(); return;
      }
      if (SIM.mode === 'exit'){ SIM.mode = 'pick'; SIM.input = ''; SIM.sel = 0; }
      if (SIM.mode === 'ask'){ SIM.ask = v; SIM.done = ''; }
      else { SIM.input = v; SIM.sel = 0; SIM.msg = ''; }
      if (v.length === prev.length + 1) flashKey(v.charAt(v.length - 1));
      simAfter();
    });
  }
}


/* ---------------- 右栏 ---------------- */
const KW = new Set(('int char bool void if else while for return struct class using namespace '
  + 'const auto new delete true false nullptr break continue string vector map pair ofstream '
  + 'ifstream sort unsigned signed static enum switch case default size_t operator template '
  + 'typename inline do public private').split(' '));

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function hl(line){
  let out = '', i = 0;
  while (i < line.length){
    const c = line[i];
    if (c === '/' && line[i+1] === '/'){
      out += '<span class="cm">' + esc(line.slice(i)) + '</span>';
      break;
    }
    if (c === '"' || c === "'"){
      const q = c; let j = i + 1;
      while (j < line.length){
        if (line[j] === '\\'){ j += 2; continue; }
        if (line[j] === q){ j++; break; }
        j++;
      }
      out += '<span class="st">' + esc(line.slice(i, j)) + '</span>';
      i = j; continue;
    }
    if (c === '#' && i === 0){ out += '<span class="pp">#</span>'; i++; continue; }
    if (c >= '0' && c <= '9' && !/[A-Za-z_0-9]/.test(line[i-1] || '')){
      let j = i; while (j < line.length && line[j] >= '0' && line[j] <= '9') j++;
      out += '<span class="nu">' + line.slice(i, j) + '</span>';
      i = j; continue;
    }
    if (/[A-Za-z_]/.test(c)){
      let j = i; while (j < line.length && /[A-Za-z_0-9]/.test(line[j])) j++;
      const w = line.slice(i, j);
      const after = line.slice(j);
      if (KW.has(w))             out += '<span class="kw">' + w + '</span>';
      else if (after[0] === '(') out += '<span class="fi">' + w + '</span>';
      else                       out += esc(w);
      i = j; continue;
    }
    out += esc(c); i++;
  }
  return out;
}

const SECS = { 'main.cpp': [ { n:23, name:'初始化' }, { n:54, name:'循环' }, { n:132, name:'结束' } ] };

function setFile(name){
  if (name === curFile) return;
  curFile = name;
  buildCode(name);
}

function buildCode(name){
  const src = SOURCES[name];
  if (!src) return;
  fileNameEl.textContent = name;
  filePathEl.textContent = src.path;
  codeBody.innerHTML = '';
  const secs = SECS[name] || [];
  src.lines.forEach(function(text, i){
    const n = i + 1;
    const sec = secs.filter(function(s){ return s.n === n; })[0];
    if (sec){
      const d = h('div','sec');
      d.innerHTML = '<span>' + sec.name + '</span>';
      codeBody.appendChild(d);
    }
    const ln = h('div','ln');
    ln.dataset.n = n;
    ln.innerHTML = '<span class="num">' + n + '</span>'
                 + '<span class="txt">' + (hl(text) || ' ') + '</span>';
    codeBody.appendChild(ln);
  });
  codeBody.scrollTop = 0;
}

function applyCode(range, label){
  rangeLabel.textContent = label;
  const rbar = document.getElementById('rbar');
  if (rbar){
    rbar.style.display = '';
    const fill = rbar.children[0];
    if (fill){
      const total = (SOURCES[curFile] && SOURCES[curFile].lines) ? SOURCES[curFile].lines.length : 0;
      if (range && total){
        fill.style.left = ((range[0] - 1) / total * 100).toFixed(2) + '%';
        fill.style.width = ((range[1] - range[0] + 1) / total * 100).toFixed(2) + '%';
      } else {
        fill.style.width = '0%';
      }
    }
  }
  const nodes = codeBody.querySelectorAll('.ln');
  for (let k = 0; k < nodes.length; k++){
    const L = nodes[k];
    const n = +L.dataset.n;
    const hot = range && n >= range[0] && n <= range[1];
    L.classList.toggle('hot', !!hot);
    L.classList.toggle('cold', !!range && !hot);
  }
  if (range){
    const t = codeBody.querySelector('.ln[data-n="' + range[0] + '"]');
    if (t){
      const y = t.offsetTop - codeBody.clientHeight * 0.3;
      codeBody.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
    }
  }
}

document.getElementById('reset').onclick = function(){
  pushHist();
  S.selected = null; S.openGroup = null;
  if (VBY[S.view].render === 'tree'){ collapseAllGroups(); buildTree(); }
  buildCode(curFile);
  renderChain(null);
  paint();
  renderCrumbs();
};

        || (ev.altKey && ev.key === 'ArrowLeft')){ goBack(); }

}
